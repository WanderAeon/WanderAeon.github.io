<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderAeon</title>

<style>
:root{
--main:#ff4500;
--glow:#ff9900;
--soft:#ffcc66;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
color:white;
background:url('final.jpg') center/cover no-repeat;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
animation:fadeOut 4s forwards;
}
.portal{
width:40px;height:40px;border-radius:50%;
background:radial-gradient(circle,#fff,#ff6a00,#000);
box-shadow:0 0 40px orange,0 0 150px red;
animation:expand 4s forwards;
}
@keyframes expand{0%{transform:scale(0)}100%{transform:scale(60);opacity:0}}
@keyframes fadeOut{0%,80%{opacity:1}100%{opacity:0;pointer-events:none}}

/* CANVAS */
canvas{position:fixed;inset:0;pointer-events:none}

/* VISITOR LOG */
.visitor-box{
position:fixed;
right:12px;
bottom:12px;
padding:10px 14px;
border:2px solid orange;
border-radius:14px;
background:rgba(0,0,0,.65);
box-shadow:0 0 15px orange;
font-size:14px;
text-align:center;
z-index:20;
}
.visitor-box span{
display:block;
color:#ffb347;
font-size:16px;
}

/* CENTER LOGO */
section{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
z-index:2;
position:relative;
}
.glow-text{
font-size:3em;
font-weight:bold;
background:linear-gradient(90deg,var(--main),var(--glow),var(--soft));
-webkit-background-clip:text;
color:transparent;
animation:fire 1.5s infinite alternate;
text-shadow:0 0 25px orange;
}
@keyframes fire{from{background-position:0%}to{background-position:100%}}

@media(max-width:768px){
.glow-text{font-size:2.2em}
}
</style>
</head>

<body>

<div id="intro"><div class="portal"></div></div>

<!-- VISITOR LOG -->
<div class="visitor-box">
Live
<span id="liveCount">0</span>
Total
<span id="totalCount">0</span>
</div>

<canvas id="embers"></canvas>
<canvas id="fire"></canvas>

<section>
<h1 class="glow-text">WanderAeon</h1>
</section>

<!-- FIRE + EMBERS -->
<script>
const bg=document.getElementById("embers");
const fire=document.getElementById("fire");
const bctx=bg.getContext("2d");
const fctx=fire.getContext("2d");

function resize(){
bg.width=fire.width=innerWidth;
bg.height=fire.height=innerHeight;
}
resize();onresize=resize;

let embers=[];
for(let i=0;i<140;i++)
embers.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*2.5});

function animateBG(){
bctx.clearRect(0,0,innerWidth,innerHeight);
for(let e of embers){
e.y+=0.4;
if(e.y>innerHeight)e.y=0;
bctx.fillStyle="rgba(255,150,0,.6)";
bctx.beginPath();
bctx.arc(e.x,e.y,e.s,0,Math.PI*2);
bctx.fill();
}
requestAnimationFrame(animateBG);
}

let flames=[];
function spawn(x,y){
for(let i=0;i<3;i++)
flames.push({
x,y,s:Math.random()*6+2,a:1,
vx:(Math.random()-.5)*1.2,
vy:-Math.random()*2
});
}

addEventListener("mousemove",e=>spawn(e.clientX,e.clientY));
addEventListener("touchmove",e=>{
let t=e.touches[0];
spawn(t.clientX,t.clientY);
},{passive:true});

function animateFire(){
fctx.clearRect(0,0,innerWidth,innerHeight);
for(let i=flames.length-1;i>=0;i--){
let p=flames[i];
p.x+=p.vx;p.y+=p.vy;p.a-=.04;
if(p.a<=0)flames.splice(i,1);
else{
fctx.globalAlpha=p.a;
fctx.fillStyle="orange";
fctx.beginPath();
fctx.arc(p.x,p.y,p.s,0,Math.PI*2);
fctx.fill();
}
}
fctx.globalAlpha=1;
requestAnimationFrame(animateFire);
}

animateBG();
animateFire();
</script>

<!-- FIREBASE REALTIME VISITORS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDI3SSJh4RzJ33kzxwWQyKrpp_0FXT-gGE",
 authDomain: "visitorlog-87a3b.firebaseapp.com",
 projectId: "visitorlog-87a3b",
 storageBucket: "visitorlog-87a3b.firebasestorage.app",
 messagingSenderId: "306691719387",
 appId: "1:306691719387:web:822a62c9e9bdb3ab6d0cfe"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db,"totalVisitors");
const liveRef = ref(db,"liveVisitors");

runTransaction(totalRef,n=>(n||0)+1);
runTransaction(liveRef,n=>(n||0)+1);

window.addEventListener("beforeunload",()=>{
runTransaction(liveRef,n=>Math.max((n||1)-1,0));
});

onValue(totalRef,s=>document.getElementById("totalCount").innerText=s.val()||0);
onValue(liveRef,s=>document.getElementById("liveCount").innerText=s.val()||0);
</script>

</body>
</html>
