<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WanderAeon</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
background:black;
touch-action:none;
}

#intro{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
animation:introFade 4s forwards;
}

.portal{
width:50px;height:50px;border-radius:50%;
background:radial-gradient(circle,#fff,#ff6a00,#000);
box-shadow:0 0 40px orange,0 0 150px red;
animation:expand 4s forwards;
}

@keyframes expand{
to{transform:scale(60);opacity:0}
}
@keyframes introFade{
0%,80%{opacity:1}
100%{opacity:0;pointer-events:none}
}

#bg{
position:fixed;
inset:0;
background:url('final.jpg') center/cover no-repeat;
filter:brightness(.6);
}

canvas{
position:fixed;
inset:0;
pointer-events:none;
}

#logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:clamp(42px,8vw,80px);
color:#ff9b00;
text-shadow:0 0 20px orange,0 0 70px red;
animation:pulse 2s infinite;
z-index:2;
}

@keyframes pulse{
50%{transform:translate(-50%,-50%) scale(1.07);}
}

/* VISITOR */
#visitor{
position:fixed;
top:12px;
right:12px;
padding:8px 14px;
border-radius:14px;
border:2px solid orange;
color:#ffc266;
background:rgba(0,0,0,.7);
box-shadow:0 0 15px orange;
z-index:4;
}

/* SOCIAL */
.social-panel{
position:fixed;
left:18px;
bottom:20px;
z-index:4;
}

.social-btn img{width:62px;cursor:pointer;}

.social-icons{
display:flex;
gap:10px;
margin-top:10px;
opacity:0;
pointer-events:none;
transition:.4s;
}

.social-icons.show{
opacity:1;
pointer-events:auto;
}

.social-icons img{
width:44px;
padding:6px;
border-radius:12px;
background:rgba(0,0,0,.6);
}
</style>
</head>

<body>

<div id="intro"><div class="portal"></div></div>
<div id="bg"></div>

<canvas id="fire"></canvas>
<canvas id="trail"></canvas>

<div id="logo">WanderAeon</div>

<div id="visitor">🔥 Visitors: <span id="count">0</span></div>

<div class="social-panel">
<div class="social-btn" id="socialBtn">
<img src="SM.gif">
</div>
<div class="social-icons" id="socialIcons">
<a href="https://www.youtube.com/@WanderAeon"><img src="youtube.png"></a>
<a href="https://www.tiktok.com/@wanderaeon"><img src="tiktok.png"></a>
<a href="https://soundcloud.com/wanderaeon"><img src="soundcloud.png"></a>
<a href="https://www.facebook.com/profile.php?id=61584853409975"><img src="facebook.png"></a>
<a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U"><img src="whatsapp.png"></a>
</div>
</div>

<script>
/* VISITORS */
let v=localStorage.getItem("vis")||0;
v++; localStorage.setItem("vis",v);
count.textContent=v;

/* SOCIAL */
const btn=document.getElementById("socialBtn");
const icons=document.getElementById("socialIcons");
let timer;
function show(){
icons.classList.add("show");
clearTimeout(timer);
timer=setTimeout(()=>icons.classList.remove("show"),3000);
}
btn.onclick=show;
btn.onmouseenter=show;

/* CANVAS SETUP */
const fire=document.getElementById("fire");
const fctx=fire.getContext("2d");
const trail=document.getElementById("trail");
const tctx=trail.getContext("2d");

function resize(){
fire.width=trail.width=innerWidth;
fire.height=trail.height=innerHeight;
}
resize(); addEventListener("resize",resize);

/* REAL FLAME PARTICLES */
let flames=[];
function spawnFire(x,y){
for(let i=0;i<6;i++){
flames.push({
x,y,
vx:(Math.random()-.5)*1.5,
vy:-Math.random()*3,
life:1,
size:Math.random()*6+4
});
}
}

function animateFire(){
fctx.clearRect(0,0,fire.width,fire.height);
for(let i=flames.length-1;i>=0;i--){
let p=flames[i];
p.x+=p.vx;
p.y+=p.vy;
p.life-=.03;
if(p.life<=0){flames.splice(i,1);continue;}
fctx.globalAlpha=p.life;
let g=fctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
g.addColorStop(0,"#fff3");
g.addColorStop(.3,"orange");
g.addColorStop(1,"red");
fctx.fillStyle=g;
fctx.beginPath();
fctx.arc(p.x,p.y,p.size,0,Math.PI*2);
fctx.fill();
}
fctx.globalAlpha=1;
requestAnimationFrame(animateFire);
}

/* TRAIL */
function spawnTrail(x,y){
tctx.fillStyle="rgba(255,160,0,.35)";
tctx.beginPath();
tctx.arc(x,y,10,0,Math.PI*2);
tctx.fill();
}

function fadeTrail(){
tctx.fillStyle="rgba(0,0,0,.15)";
tctx.fillRect(0,0,trail.width,trail.height);
requestAnimationFrame(fadeTrail);
}

/* EVENTS DESKTOP + MOBILE */
function handleMove(x,y){
spawnFire(x,y);
spawnTrail(x,y);
}

addEventListener("mousemove",e=>handleMove(e.clientX,e.clientY));
addEventListener("touchmove",e=>{
let t=e.touches[0];
handleMove(t.clientX,t.clientY);
},{passive:true});

animateFire();
fadeTrail();
</script>

</body>
</html>
