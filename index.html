<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderAeon | Not just heard, experienced</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<style>
/* Base Setup */
*, *::before, *::after { box-sizing: border-box; }
:root{ --main: #ff4500; --released: #00ff88; --teaser: #ff3333; --hit: #ffd700; --burn: #ffcc00; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505 url('final.jpg') center/cover no-repeat fixed; overflow: hidden; font-family: sans-serif; position: relative; }

/* NEON VISUALIZER BARS */
.visualizer-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 0 20px; z-index: 4; pointer-events: none; opacity: 0.6; }
.bar { width: 3px; height: 10px; background: var(--main); box-shadow: 0 0 10px var(--main); border-radius: 2px 2px 0 0; animation: bounce 1.5s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { height: 5px; opacity: 0.3; } 50% { height: 40px; opacity: 1; } }

/* ORBITAL ALPHABETS CURSOR */
#cursor-container { position: fixed; pointer-events: none; z-index: 9999; display: none; }
#cursor-dot { position: absolute; width: 6px; height: 6px; background: var(--main); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--main), 0 0 30px var(--main); }
.orbit-letter { position: absolute; font-family: 'Orbitron'; font-size: 12px; color: white; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 8px var(--main); animation: rotateLetter 3.5s linear infinite; transform-origin: center center; }
@keyframes rotateLetter { from { transform: rotate(0deg) translateX(40px) rotate(0deg); } to { transform: rotate(360deg) translateX(40px) rotate(-360deg); } }

@media (pointer: fine) { body { cursor: none; } a, .node, .social-btn, .social-icons a, button { cursor: none; } }

/* INTRO LAYER */
#intro { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1.5s ease-out; pointer-events: auto; }
.pulse-container { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
.heart-pulse { position: absolute; width: 100px; height: 100px; border: 3px solid var(--main); border-radius: 50%; opacity: 0; animation: pulseAnim 1.8s infinite ease-out; }
.pulse-2 { animation-delay: 0.6s; }
.intro-text { font-family: 'Orbitron'; font-size: 20px; color: white; letter-spacing: 12px; text-transform: uppercase; z-index: 1000; }
@keyframes pulseAnim { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(5); opacity: 0; } }

#start-btn { margin-top: 20px; padding: 12px 35px; background: transparent; border: 2px solid var(--main); color: white; font-family: 'Orbitron'; cursor: pointer; letter-spacing: 3px; transition: 0.3s; z-index: 1001; text-transform: uppercase; }
#start-btn:hover { background: var(--main); box-shadow: 0 0 30px var(--main); transform: scale(1.1); }

.loaded #intro { opacity: 0; pointer-events: none; }

/* VISUALS CANVAS */
canvas { position: fixed; inset: 0; pointer-events: none; }
#leaves-canvas { z-index: 1; opacity: 0.8; }
#fire-canvas { z-index: 2; }
#universe { position: fixed; inset: 0; z-index: 5; pointer-events: auto; }

/* NODES */
.node { position: absolute; font-family: 'Orbitron', sans-serif; font-size: 11px; color: white; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; animation: deepBreathe 8s infinite ease-in-out; opacity: 0; }
.node span { font-size: 11px; }
.node:hover { opacity: 1 !important; transform: scale(1.1); z-index: 10; animation: none !important; }
.dot { width: 7px; height: 7px; border-radius: 50%; margin-bottom: 10px; }
.red .dot { background: var(--teaser); box-shadow: 0 0 10px var(--teaser); }
.green .dot { background: var(--released); box-shadow: 0 0 10px var(--released); }
.gold .dot { background: var(--hit); box-shadow: 0 0 10px var(--hit); }
@keyframes deepBreathe { 0%, 100% { opacity: 0.1; filter: blur(4px); transform: scale(0.9); } 30%, 70% { opacity: 1; filter: blur(0px); transform: scale(1); } }

/* SOCIAL PANEL */
.social-panel { position: fixed; left: 40px; top: 50%; transform: translateY(-50%); z-index: 100; pointer-events: auto; }
.social-btn { position: relative; width: 70px; height: 70px; z-index: 110; cursor: pointer; border-radius: 50%; background: rgba(0,0,0,0.8); border: 2px solid var(--main); display: flex; justify-content: center; align-items: center; overflow: hidden; transition: 0.4s; }
.social-icons { position: absolute; top: 50%; left: 35px; width: 0; height: 350px; transform: translateY(-50%); display: flex; flex-direction: column; justify-content: center; gap: 15px; opacity: 0; visibility: hidden; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
.social-icons.show { opacity: 1; visibility: visible; width: 100px; left: 90px; pointer-events: auto; }
.social-icons a { width: 50px; height: 50px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; display: flex; justify-content: center; align-items: center; transition: 0.3s; overflow: hidden; }

.glow-text { font-family: 'Orbitron'; font-size: 8vw; letter-spacing: 12px; background: linear-gradient(#fff, var(--main)); -webkit-background-clip: text; color: transparent; text-align: center; margin: 0; pointer-events: none; z-index: 2; position: relative; }

@media (max-width: 768px) {
    .social-panel { left: 10px; }
    .glow-text { font-size: 12vw; }
    #cursor-container, .visualizer-container { display: none !important; }
}
</style>
</head>
<body>

<audio id="bg-music" loop preload="auto">
    <source src="We_are_WanderAeon.mp3" type="audio/mpeg">
    <source src="We_are_WanderAeon" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<div class="visualizer-container" id="visualizer"></div>

<div id="cursor-container">
    <div id="cursor-dot"></div>
</div>

<div id="intro">
    <div class="pulse-container">
        <div class="heart-pulse"></div>
        <div class="heart-pulse pulse-2"></div>
        <div class="intro-text">WanderAeon</div>
    </div>
    <button id="start-btn">Experience with Sound</button>
</div>

<canvas id="leaves-canvas"></canvas>
<canvas id="fire-canvas"></canvas>
<div id="universe"></div>

<div class="social-panel">
    <div class="social-btn" id="socialBtn"><img src="SM.gif" alt="Socials" style="width:100%"></div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank"><img src="youtube.png" style="width:32px"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank"><img src="tiktok.png" style="width:32px"></a>
        <a href="https://soundcloud.com/wanderaeon" target="_blank"><img src="soundcloud.png" style="width:32px"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank"><img src="facebook.png" style="width:32px"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank"><img src="whatsapp.png" style="width:32px"></a>
    </div>
</div>

<section style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 class="glow-text">WanderAeon</h1>
</section>

<script>
const startBtn = document.getElementById('start-btn');
const bgMusic = document.getElementById('bg-music');

// Play Music logic
startBtn.addEventListener('click', () => {
    bgMusic.volume = 0.4; 
    let playPromise = bgMusic.play();
    
    if (playPromise !== undefined) {
        playPromise.then(_ => {
            console.log("Audio started successfully");
        }).catch(error => {
            console.log("Audio failed to play. Check file name:", error);
            alert("Music file dastyab nahi hai. File ka naam 'We_are_WanderAeon.mp3' check karein.");
        });
    }
    document.body.classList.add('loaded');
});

// Visualizer Bars
const viz = document.getElementById("visualizer");
for(let i=0; i<40; i++) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.animationDelay = `${Math.random() * 1.5}s`;
    viz.appendChild(bar);
}

// Cursor Orbital Letters
const cursorContainer = document.getElementById("cursor-container");
const brandName = "WanderAeon";
brandName.split("").forEach((char, index) => {
    const span = document.createElement("span");
    span.innerText = char;
    span.className = "orbit-letter";
    span.style.animationDelay = `${index * 0.12}s`; 
    cursorContainer.appendChild(span);
});

// Canvas Setup
const lCanvas = document.getElementById("leaves-canvas"); const lCtx = lCanvas.getContext("2d");
const fCanvas = document.getElementById("fire-canvas"); const fCtx = fCanvas.getContext("2d");
let leaves = []; let flames = []; const leafColors = ["#cc4400", "#e6b800", "#ff6600", "#b33c00"];

function resize() { lCanvas.width = fCanvas.width = window.innerWidth; lCanvas.height = fCanvas.height = window.innerHeight; initLeaves(); }
function initLeaves() {
    leaves = [];
    let count = window.innerWidth < 768 ? 20 : 45; 
    for(let i=0; i<count; i++) {
        leaves.push({ x: Math.random() * lCanvas.width, y: Math.random() * lCanvas.height, r: Math.random() * 5 + 3, color: leafColors[Math.floor(Math.random() * leafColors.length)], vx: (Math.random() - 0.5) * 1, vy: Math.random() * 0.5 + 0.3, angle: Math.random() * Math.PI * 2, isBurning: false, burnTime: 0 });
    }
}
function spawnFire(x, y) { for(let i=0; i<5; i++) flames.push({ x, y, s: Math.random()*5+2, a:1, vx:(Math.random()-.5)*2, vy:-Math.random()*3 }); }
function draw() {
    lCtx.clearRect(0,0,lCanvas.width, lCanvas.height); fCtx.clearRect(0,0,fCanvas.width, fCanvas.height);
    leaves.forEach(p => {
        lCtx.save(); lCtx.translate(p.x, p.y); lCtx.rotate(p.angle);
        if (p.isBurning) {
            p.burnTime += 1; lCtx.fillStyle = `rgba(255, ${200 - p.burnTime * 2}, 0, ${1 - p.burnTime/60})`;
            if (p.burnTime % 5 === 0) spawnFire(p.x, p.y);
            if (p.burnTime > 60) { p.isBurning = false; p.burnTime = 0; p.y = -20; }
        } else { lCtx.fillStyle = p.color; }
        lCtx.beginPath(); lCtx.moveTo(0,0); lCtx.lineTo(p.r, p.r); lCtx.lineTo(0, p.r*2); lCtx.lineTo(-p.r, p.r); lCtx.closePath(); lCtx.fill(); lCtx.restore();
        p.y += p.vy; p.x += p.vx; p.angle += 0.005;
        if(p.y > lCanvas.height) { p.y = -20; p.x = Math.random() * lCanvas.width; }
    });
    for(let i=flames.length-1; i>=0; i--) {
        let p = flames[i]; p.x += p.vx; p.y += p.vy; p.a -= 0.04;
        if(p.a <= 0) flames.splice(i, 1); else { fCtx.globalAlpha = p.a; fCtx.fillStyle = "orange"; fCtx.beginPath(); fCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); fCtx.fill(); }
    }
    requestAnimationFrame(draw);
}

// Interactivity
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (!isTouchDevice) { cursorContainer.style.display = 'block'; }

addEventListener("mousemove", e => { 
    let mX = e.clientX; let mY = e.clientY;
    if (!isTouchDevice) { cursorContainer.style.left = mX + 'px'; cursorContainer.style.top = mY + 'px'; }
    spawnFire(mX, mY); 
    
    const bars = document.querySelectorAll('.bar');
    bars.forEach(bar => {
        const rect = bar.getBoundingClientRect();
        const dist = Math.abs(mX - rect.left);
        if(dist < 100) { bar.style.height = (90 - dist/2) + 'px'; bar.style.background = "#fff"; }
        else { bar.style.background = "var(--main)"; }
    });

    nodes.forEach(n => {
        const dx = mX - n.x; const dy = mY - n.y; const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 220) { n.el.style.animation = 'none'; n.el.style.opacity = 1 - (dist/220); n.el.style.filter = "blur(0px)"; } 
        else { n.el.style.animation = 'deepBreathe 8s infinite ease-in-out'; }
    });
    leaves.forEach(leaf => { if(Math.sqrt((mX-leaf.x)**2 + (mY-leaf.y)**2) < 30) leaf.isBurning = true; });
});

resize(); draw(); window.onresize = resize;

// Song Nodes
const songs = [
    { name: "Wanderer", type: "red", link: "https://youtu.be/oE4C19lM4fA" },
    { name: "Untamed Shadows", type: "green", link: "https://www.youtube.com/watch?v=VQXMUNpGjjQ" },
    { name: "Before the Return", type: "green", link: "https://www.youtube.com/watch?v=0wBXdnBznY0" },
    { name: "Sunno", type: "green", link: "https://www.youtube.com/watch?v=02uImf7-wfQ" },
    { name: "Sunna hay", type: "green", link: "https://www.youtube.com/watch?v=H9HPTlYHkjQ" },
    { name: "JanEJana", type: "gold", link: "https://www.youtube.com/watch?v=twd-aJLq30U" }
];
const nodes = []; const univ = document.getElementById('universe');
songs.forEach((song) => {
    const el = document.createElement('div'); el.className = `node ${song.type}`;
    el.innerHTML = `<div class="dot"></div><span>${song.name}</span>`;
    el.onclick = () => window.open(song.link, '_blank');
    const x = 15 + Math.random() * 70; const y = 20 + Math.random() * 60;
    el.style.left = x + '%'; el.style.top = y + '%';
    univ.appendChild(el); nodes.push({ el, x: (x/100)*innerWidth, y: (y/100)*innerHeight });
});

const btn = document.getElementById("socialBtn"); const icons = document.getElementById("socialIcons");
btn.onclick = (e) => { e.stopPropagation(); icons.classList.toggle("show"); };
document.body.onclick = () => { icons.classList.remove("show"); };
</script>
</body>
</html>
