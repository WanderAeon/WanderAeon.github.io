<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderAeon | Professional Burning Constellation</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<style>
:root{ --main: #ff4500; --released: #00ff88; --teaser: #ff3333; --hit: #ffd700; --leaf-dark: #cc4400; --leaf-gold: #e6b800; --burn: #ffcc00; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505 url('final.jpg') center/cover no-repeat fixed; overflow: hidden; font-family: sans-serif; }

/* INTRO PORTAL */
#intro { position: fixed; inset: 0; background: black; z-index: 999; display: flex; justify-content: center; align-items: center; }
.fog-panel { position: absolute; top: 0; width: 50%; height: 100%; background: linear-gradient(rgba(0,0,0,0.9), rgba(20,20,20,0.95)); backdrop-filter: blur(50px); transition: transform 2s cubic-bezier(0.7, 0, 0.3, 1); }
.left-panel { left: 0; border-right: 1px solid rgba(255, 69, 0, 0.1); }
.right-panel { right: 0; border-left: 1px solid rgba(255, 69, 0, 0.1); }
.loaded .left-panel { transform: translateX(-100%); }
.loaded .right-panel { transform: translateX(100%); }
.loaded #intro { pointer-events: none; transition: opacity 1s 1.5s; opacity: 0; }
.fog-core { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--main)); box-shadow: 0 0 50px var(--main); animation: fogPulse 2s infinite alternate; position: absolute; z-index: 1000; }
@keyframes fogPulse { from { transform: scale(0.8); opacity: 0.5; } to { transform: scale(1.1); opacity: 1; } }

/* CANVASES */
canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
#leaves-canvas { opacity: 0.8; }
#fire-canvas { z-index: 2; }

/* CONSTELLATION SYSTEM */
#universe { position: fixed; inset: 0; z-index: 5; }
.node { 
    position: absolute; font-family: 'Orbitron', sans-serif; font-size: 11px; color: white;
    text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    animation: deepBreathe 8s infinite ease-in-out; opacity: 0;
}
.node:hover { opacity: 1 !important; transform: scale(1.1); filter: blur(0px) !important; animation: none !important; z-index: 10; }
.dot { width: 7px; height: 7px; border-radius: 50%; margin-bottom: 10px; }
@keyframes deepBreathe { 0%, 100% { opacity: 0.05; filter: blur(4px); transform: scale(0.9); } 30%, 70% { opacity: 1; filter: blur(0px); transform: scale(1); } }
.green .dot { background: var(--released); box-shadow: 0 0 15px var(--released); }
.red .dot { background: var(--teaser); box-shadow: 0 0 15px var(--teaser); }
.gold .dot { background: var(--hit); box-shadow: 0 0 25px var(--hit); animation: hitPulse 1.5s infinite alternate; }
@keyframes hitPulse { from { transform: scale(1); box-shadow: 0 0 10px var(--hit); } to { transform: scale(1.4); box-shadow: 0 0 35px var(--hit); } }

/* --- PROFESSIONAL SOCIAL PANEL --- */
.social-panel { position: fixed; left: 40px; top: 50%; transform: translateY(-50%); z-index: 100; }
.social-btn { 
    position: relative; width: 70px; height: 70px; z-index: 110; cursor: pointer; 
    border-radius: 50%; background: rgba(0,0,0,0.8); border: 2px solid var(--main);
    display: flex; justify-content: center; align-items: center; overflow: hidden;
    transition: 0.4s; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
}
.social-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--main); }
.social-btn img { width: 80%; filter: drop-shadow(0 0 5px var(--main)); }

.social-icons { 
    position: absolute; top: 50%; left: 35px; width: 0; height: 350px; 
    transform: translateY(-50%); display: flex; flex-direction: column; 
    justify-content: center; gap: 15px; opacity: 0; visibility: hidden; 
    transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
}
.social-icons.show { opacity: 1; visibility: visible; width: 100px; left: 90px; pointer-events: auto; }

.social-icons a { 
    width: 50px; height: 50px; background: rgba(0,0,0,0.7); 
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; 
    display: flex; justify-content: center; align-items: center; 
    transition: 0.3s; backdrop-filter: blur(10px); position: relative;
}
.social-icons a img { width: 24px; filter: invert(1) opacity(0.8); transition: 0.3s; }

/* Individual Brand Hovers */
.yt:hover { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; transform: translateX(10px); }
.tk:hover { border-color: #00f2ea; box-shadow: 0 0 15px #00f2ea; transform: translateX(10px); }
.sc:hover { border-color: #ff5500; box-shadow: 0 0 15px #ff5500; transform: translateX(10px); }
.fb:hover { border-color: #1877f2; box-shadow: 0 0 15px #1877f2; transform: translateX(10px); }
.wa:hover { border-color: #25d366; box-shadow: 0 0 15px #25d366; transform: translateX(10px); }
.social-icons a:hover img { filter: invert(1) opacity(1) drop-shadow(0 0 5px white); }

/* Tooltip text */
.social-icons a::after {
    content: attr(data-label); position: absolute; left: 60px; background: rgba(0,0,0,0.8);
    color: white; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-family: 'Orbitron';
    opacity: 0; white-space: nowrap; pointer-events: none; transition: 0.3s; border: 1px solid var(--main);
}
.social-icons a:hover::after { opacity: 1; left: 70px; }

.glow-text { font-family: 'Orbitron'; font-size: 8vw; letter-spacing: 12px; background: linear-gradient(#fff, var(--main)); -webkit-background-clip: text; color: transparent; text-align: center; margin: 0; pointer-events: none; z-index: 2; position: relative; }
</style>
</head>
<body onload="document.body.classList.add('loaded')">

<div id="intro">
    <div class="fog-panel left-panel"></div>
    <div class="fog-core"></div>
    <div class="fog-panel right-panel"></div>
</div>

<canvas id="leaves-canvas"></canvas>
<canvas id="fire-canvas"></canvas>
<div id="universe"></div>

<div class="social-panel">
    <div class="social-btn" id="socialBtn"><img src="SM.gif" alt="Socials"></div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank" class="yt" data-label="YouTube"><img src="youtube.png"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank" class="tk" data-label="TikTok"><img src="tiktok.png"></a>
        <a href="https://soundcloud.com/wanderaeon" target="_blank" class="sc" data-label="SoundCloud"><img src="soundcloud.png"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank" class="fb" data-label="Facebook"><img src="facebook.png"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank" class="wa" data-label="WhatsApp Channel"><img src="whatsapp.png"></a>
    </div>
</div>

<section style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 class="glow-text">WanderAeon</h1>
</section>

<script>
const lCanvas = document.getElementById("leaves-canvas");
const lCtx = lCanvas.getContext("2d");
const fCanvas = document.getElementById("fire-canvas");
const fCtx = fCanvas.getContext("2d");

let leaves = [];
let flames = [];
const leafColors = ["#cc4400", "#e6b800", "#ff6600", "#b33c00"];

function resize() {
    lCanvas.width = fCanvas.width = window.innerWidth;
    lCanvas.height = fCanvas.height = window.innerHeight;
    initLeaves();
}

function initLeaves() {
    leaves = [];
    for(let i=0; i<45; i++) {
        leaves.push({
            x: Math.random() * lCanvas.width,
            y: Math.random() * lCanvas.height,
            r: Math.random() * 5 + 3,
            color: leafColors[Math.floor(Math.random() * leafColors.length)],
            vx: (Math.random() - 0.5) * 3,
            vy: Math.random() * 3 + 2,
            angle: Math.random() * Math.PI * 2,
            isBurning: false,
            burnTime: 0
        });
    }
}

function spawnFire(x, y) {
    for(let i=0; i<5; i++)
        flames.push({ x, y, s: Math.random()*5+2, a:1, vx:(Math.random()-.5)*2, vy:-Math.random()*3, age:0 });
}

function draw() {
    lCtx.clearRect(0,0,lCanvas.width, lCanvas.height);
    fCtx.clearRect(0,0,fCanvas.width, fCanvas.height);

    leaves.forEach(p => {
        lCtx.save();
        lCtx.translate(p.x, p.y);
        lCtx.rotate(p.angle);
        if (p.isBurning) {
            p.burnTime += 1;
            lCtx.fillStyle = `rgba(255, ${200 - p.burnTime * 2}, 0, ${1 - p.burnTime/60})`;
            lCtx.shadowBlur = 10;
            lCtx.shadowColor = "orange";
            if (p.burnTime % 5 === 0) spawnFire(p.x, p.y);
            if (p.burnTime > 60) { p.isBurning = false; p.burnTime = 0; p.y = -20; p.x = Math.random() * lCanvas.width; }
        } else {
            lCtx.fillStyle = p.color;
            lCtx.shadowBlur = 0;
        }
        lCtx.beginPath();
        lCtx.moveTo(0,0); lCtx.lineTo(p.r, p.r); lCtx.lineTo(0, p.r*2); lCtx.lineTo(-p.r, p.r);
        lCtx.closePath();
        lCtx.fill();
        lCtx.restore();
        p.y += p.vy; p.x += p.vx; p.angle += 0.02;
        if(p.y > lCanvas.height) { p.y = -20; p.x = Math.random() * lCanvas.width; p.isBurning = false; p.burnTime = 0; }
    });

    for(let i=flames.length-1; i>=0; i--) {
        let p = flames[i]; p.x += p.vx; p.y += p.vy; p.a -= 0.04;
        if(p.a <= 0) flames.splice(i, 1);
        else {
            fCtx.globalAlpha = p.a; fCtx.fillStyle = "orange";
            fCtx.beginPath(); fCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); fCtx.fill();
        }
    }
    fCtx.globalAlpha = 1;
    requestAnimationFrame(draw);
}

resize(); draw(); window.onresize = resize;

const songs = [
    { name: "Wanderer", type: "red", link: "https://youtu.be/oE4C19lM4fA?si=NmCr6O1z5hHFQhJ3" },
    { name: "Untamed Shadows", type: "green", link: "https://www.youtube.com/watch?v=VQXMUNpGjjQ" },
    { name: "Before the Return", type: "green", link: "https://www.youtube.com/watch?v=0wBXdnBznY0" },
    { name: "Sunno", type: "green", link: "https://www.youtube.com/watch?v=02uImf7-wfQ" },
    { name: "Sunna hay", type: "green", link: "https://www.youtube.com/watch?v=H9HPTlYHkjQ" },
    { name: "JanEJana", type: "gold", link: "https://www.youtube.com/watch?v=twd-aJLq30U" }
];

const nodes = [];
const univ = document.getElementById('universe');
let mX = 0, mY = 0;

songs.forEach((song, i) => {
    const el = document.createElement('div');
    el.className = `node ${song.type}`;
    el.innerHTML = `<div class="dot"></div><span>${song.name}</span>`;
    el.onclick = () => window.open(song.link, '_blank');
    const x = 15 + Math.random() * 70;
    const y = 20 + Math.random() * 60;
    el.style.left = x + '%'; el.style.top = y + '%';
    el.style.animationDelay = (Math.random() * 8) + 's';
    univ.appendChild(el);
    nodes.push({ el, x: (x/100)*innerWidth, y: (y/100)*innerHeight });
});

addEventListener("mousemove", e => { 
    mX = e.clientX; mY = e.clientY; 
    spawnFire(mX, mY); updateNodes(); 
    leaves.forEach(leaf => {
        const dx = mX - leaf.x; const dy = mY - leaf.y;
        if(Math.sqrt(dx*dx + dy*dy) < 30) leaf.isBurning = true;
    });
});

function updateNodes() {
    nodes.forEach(n => {
        const dx = mX - n.x; const dy = mY - n.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 220) {
            n.el.style.animation = 'none';
            n.el.style.opacity = 1 - (dist/220);
            n.el.style.filter = "blur(0px)";
        } else {
            n.el.style.animation = 'deepBreathe 8s infinite ease-in-out';
        }
    });
}

// Professional Social Toggle Logic
const btn = document.getElementById("socialBtn");
const icons = document.getElementById("socialIcons");
let socialActive = false;

function toggleSocials() {
    socialActive = !socialActive;
    if(socialActive) {
        icons.classList.add("show");
    } else {
        icons.classList.remove("show");
    }
}

btn.onclick = (e) => { e.stopPropagation(); toggleSocials(); };
document.body.onclick = () => { icons.classList.remove("show"); socialActive = false; };
</script>
</body>
</html>
