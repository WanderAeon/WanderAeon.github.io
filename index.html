<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderAeon</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
}

#bg{
position:fixed;
width:100%;
height:100%;
background:url('final.jpg') center/cover no-repeat;
filter:brightness(0.6);
}

/* FIRE INTRO */
#fireIntro{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#ff6a00,#000);
animation:fireOut 2.5s forwards;
z-index:10;
}

@keyframes fireOut{
0%{opacity:1;}
100%{opacity:0;visibility:hidden;}
}

/* LOGO TEXT */
#logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
color:#ff8c00;
text-shadow:0 0 25px orange,0 0 60px red;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%,100%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.05);}
}

/* VISITOR BOX */
#visitorBox{
position:fixed;
top:15px;
right:15px;
border:2px solid orange;
padding:8px 14px;
color:#ffb347;
font-size:14px;
border-radius:12px;
box-shadow:0 0 15px orange;
background:rgba(0,0,0,0.6);
}

/* SOCIAL PANEL */
.social-panel{
position:fixed;
bottom:20px;
left:20px;
z-index:5;
}

.social-btn img{
width:65px;
cursor:pointer;
}

.social-icons{
display:flex;
gap:10px;
margin-top:10px;
opacity:0;
pointer-events:none;
transition:0.4s;
}

.social-icons img{
width:45px;
}

.social-icons.show{
opacity:1;
pointer-events:auto;
}

/* MOBILE FIX */
@media(max-width:600px){
#logo{font-size:45px;}
.social-btn img{width:55px;}
.social-icons img{width:40px;}
}
</style>
</head>

<body>

<div id="fireIntro"></div>
<div id="bg"></div>

<div id="logo">WanderAeon</div>

<div id="visitorBox">
🔥 Visitors: <span id="count">0</span>
</div>

<!-- SOCIAL DROPDOWN -->
<div class="social-panel">

<div class="social-btn" id="socialBtn">
<img src="SM.gif">
</div>

<div class="social-icons" id="socialIcons">
<a href="https://www.youtube.com/@WanderAeon" target="_blank"><img src="youtube.png"></a>
<a href="https://www.tiktok.com/@wanderaeon" target="_blank"><img src="tiktok.png"></a>
<a href="https://soundcloud.com/wanderaeon" target="_blank"><img src="soundcloud.png"></a>
<a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank"><img src="facebook.png"></a>
<a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank"><img src="whatsapp.png"></a>
</div>

</div>

<script>
let count = localStorage.getItem("visits") || 0;
count++;
localStorage.setItem("visits",count);
document.getElementById("count").innerText = count;

const btn = document.getElementById("socialBtn");
const icons = document.getElementById("socialIcons");
let timer;

function showIcons(){
icons.classList.add("show");
clearTimeout(timer);
timer=setTimeout(()=>icons.classList.remove("show"),3000);
}

btn.addEventListener("click",showIcons);
btn.addEventListener("mouseenter",showIcons);
</script>

</body>
</html>
