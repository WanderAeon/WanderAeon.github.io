<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderAeon | The Golden Hit</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<style>
:root{ 
    --main: #ff4500; 
    --released: #00ff88; 
    --teaser: #ff3333; 
    --hit: #ffd700; /* Golden Color */
}
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505 url('final.jpg') center/cover no-repeat fixed; overflow: hidden; font-family: sans-serif; }

#intro { position: fixed; inset: 0; background: black; display: flex; justify-content: center; align-items: center; z-index: 999; animation: fadeOut 3s forwards 1s; }
.portal { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--main), #000); box-shadow: 0 0 40px orange, 0 0 150px red; animation: expand 3s forwards; }
@keyframes expand { 0% { transform: scale(0) } 100% { transform: scale(80); opacity: 0 } }
@keyframes fadeOut { 0%, 80% { opacity: 1 } 100% { opacity: 0; pointer-events: none } }

canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

#cube-universe { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.sonic-cube { 
    position: absolute; padding: 12px 18px; border-radius: 8px; 
    font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; pointer-events: auto;
    text-transform: uppercase; letter-spacing: 2px;
    border: 1px solid rgba(255,255,255,0.1); 
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    text-align: center; min-width: 120px;
    transition: transform 0.2s ease-out;
}

.cube-green { background: rgba(0, 255, 136, 0.05); border-color: var(--released); color: var(--released); box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }
.cube-red { background: rgba(255, 51, 51, 0.05); border-color: var(--teaser); color: var(--teaser); box-shadow: 0 0 15px rgba(255, 51, 51, 0.3); }

/* Golden Hit Styling for JanEjana */
.cube-gold { 
    background: rgba(255, 215, 0, 0.1); border-color: var(--hit); color: var(--hit); 
    box-shadow: 0 0 25px var(--hit);
    animation: goldPulse 2s infinite alternate;
}
@keyframes goldPulse { from { box-shadow: 0 0 10px var(--hit); } to { box-shadow: 0 0 35px var(--hit); } }

.social-panel { position: fixed; left: 50px; top: 50%; transform: translateY(-50%); z-index: 100; }
.social-btn { position: relative; width: 65px; height: 65px; z-index: 105; cursor: pointer; }
.social-btn img { width: 100%; filter: drop-shadow(0 0 15px var(--main)); }
.social-icons { position: absolute; top: 50%; left: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; opacity: 0; visibility: hidden; transition: 0.6s; transform: rotate(-90deg) scale(0.3); z-index: 104; }
.social-icons.show { opacity: 1; visibility: visible; transform: rotate(0deg) scale(1); animation: slowSpin 25s linear infinite; }
@keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.social-icons a { position: absolute; width: 45px; height: 45px; background: rgba(0,0,0,0.9); border: 1.5px solid var(--main); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
.social-icons img { width: 24px !important; filter: invert(1); }
.i1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
.i2 { top: 50%; right: 0; transform: translate(50%, -50%); }
.i3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
.i4 { top: 50%; left: 0; transform: translate(-50%, -50%); }
.i5 { top: 18%; right: 18%; transform: translate(50%, -50%); }

.glow-text { font-family: 'Orbitron'; font-size: 8vw; letter-spacing: 12px; background: linear-gradient(#fff, var(--main)); -webkit-background-clip: text; color: transparent; text-align: center; margin: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="intro"><div class="portal"></div></div>
<canvas id="fire"></canvas>
<div id="cube-universe"></div>

<div class="social-panel">
    <div class="social-btn" id="socialBtn"><img src="SM.gif" alt="Socials"></div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank" class="i1"><img src="youtube.png"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank" class="i2"><img src="tiktok.png"></a>
        <a href="https://soundcloud.com/wanderaeon" target="_blank" class="i3"><img src="soundcloud.png"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank" class="i4"><img src="facebook.png"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank" class="i5"><img src="whatsapp.png"></a>
    </div>
</div>

<section style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 class="glow-text">WanderAeon</h1>
</section>

<script>
const fire=document.getElementById("fire"); const fctx=fire.getContext("2d");
function resize(){ fire.width=innerWidth; fire.height=innerHeight; }
resize(); onresize=resize;
let flames=[]; function spawn(x,y){ for(let i=0;i<4;i++) flames.push({x,y,s:Math.random()*5+2,a:1,vx:(Math.random()-.5)*1.5,vy:-Math.random()*2}); }
let mX = 0, mY = 0;
addEventListener("mousemove",e=>{ spawn(e.clientX,e.clientY); mX = e.clientX; mY = e.clientY; });

function animateFire(){ fctx.clearRect(0,0,innerWidth,innerHeight); for(let i=flames.length-1;i>=0;i--){ let p=flames[i]; p.x+=p.vx; p.y+=p.vy; p.a-=.04; if(p.a<=0) flames.splice(i,1); else{ fctx.globalAlpha=p.a; fctx.fillStyle="orange"; fctx.beginPath(); fctx.arc(p.x,p.y,p.s,0,Math.PI*2); fctx.fill(); } } requestAnimationFrame(animateFire); }
animateFire();

const songs = [
    { name: "Wanderer", type: "red", link: "https://youtu.be/oE4C19lM4fA?si=NmCr6O1z5hHFQhJ3" },
    { name: "Untamed Shadows", type: "green", link: "https://www.youtube.com/watch?v=VQXMUNpGjjQ" },
    { name: "Before the Return", type: "green", link: "https://www.youtube.com/watch?v=0wBXdnBznY0" },
    { name: "Sunno", type: "green", link: "https://www.youtube.com/watch?v=02uImf7-wfQ" },
    { name: "Sunna hay", type: "green", link: "https://www.youtube.com/watch?v=H9HPTlYHkjQ" },
    { name: "JanEJana", type: "gold", link: "https://www.youtube.com/watch?v=twd-aJLq30U" }
];

const cubes = [];
songs.forEach(song => {
    const el = document.createElement('div');
    el.className = `sonic-cube cube-${song.type}`;
    el.innerHTML = `<span>${song.name}</span>`;
    el.onclick = () => { for(let i=0; i<10; i++) spawn(event.clientX, event.clientY); setTimeout(() => window.open(song.link, '_blank'), 200); };
    document.getElementById('cube-universe').appendChild(el);
    cubes.push({ el, x: Math.random()*innerWidth, y: Math.random()*innerHeight, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2 });
});

function animateCubes() {
    cubes.forEach(c => {
        c.x += c.vx; c.y += c.vy;
        const dx = mX - c.x; const dy = mY - c.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        // BALANCED MAGNETISM: Pass aane par door dhakailna
        if(dist < 200) {
            if(dist > 50) { c.x += dx * 0.02; c.y += dy * 0.02; } 
            else { c.x -= dx * 0.1; c.y -= dy * 0.1; } // Push back if too close
        }

        if (c.x <= 0 || c.x >= innerWidth - 140) c.vx *= -1;
        if (c.y <= 0 || c.y >= innerHeight - 60) c.vy *= -1;
        c.el.style.left = c.x + 'px'; c.el.style.top = c.y + 'px';
    });
    requestAnimationFrame(animateCubes);
}
animateCubes();

const btn=document.getElementById("socialBtn"); const icons=document.getElementById("socialIcons");
function show(){ icons.classList.add("show"); setTimeout(()=>icons.classList.remove("show"),6000); }
btn.onclick=show; btn.onmouseenter=show;
</script>
</body>
</html>
