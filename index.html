<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderAeon | Standard Scale Heartbeat</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<style>
/* Reset dimensions precisely */
*, *::before, *::after { box-sizing: border-box; }
:root{ --main: #ff4500; --released: #00ff88; --teaser: #ff3333; --hit: #ffd700; --burn: #ffcc00; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505 url('final.jpg') center/cover no-repeat fixed; overflow: hidden; font-family: sans-serif; position: relative; }

/* ORBITAL ALPHABETS CURSOR */
#cursor-container {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    display: none;
}
#cursor-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--main);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px var(--main), 0 0 30px var(--main);
}
.orbit-letter {
    position: absolute;
    font-family: 'Orbitron';
    font-size: 12px;
    color: white;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 0 8px var(--main);
    /* Speed 1.4x fast (approx 3.5s cycle) */
    animation: rotateLetter 3.5s linear infinite;
    transform-origin: center center;
}

@keyframes rotateLetter {
    from { transform: rotate(0deg) translateX(40px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
}

/* Hide default cursor on desktop */
@media (pointer: fine) {
    body { cursor: none; }
    a, .node, .social-btn, .social-icons a { cursor: none; }
}

/* INTRO LAYER */
#intro { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; transition: opacity 1.5s ease-out 1s; pointer-events: auto; }
.pulse-container { position: relative; display: flex; justify-content: center; align-items: center; }
.heart-pulse { position: absolute; width: 100px; height: 100px; border: 3px solid var(--main); border-radius: 50%; opacity: 0; animation: pulseAnim 1.8s infinite ease-out; }
.pulse-2 { animation-delay: 0.6s; }
.intro-text { font-family: 'Orbitron'; font-size: 20px; color: white; letter-spacing: 12px; text-transform: uppercase; z-index: 1000; opacity: 0; animation: textFade 4s forwards 0.3s; }
@keyframes pulseAnim { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(5); opacity: 0; } }
@keyframes textFade { 0% { opacity: 0; filter: blur(10px); } 30%, 70% { opacity: 1; filter: blur(0px); text-shadow: 0 0 20px var(--main); } 100% { opacity: 0; filter: blur(10px); } }
.loaded #intro { opacity: 0; pointer-events: none; }

/* VISUALS */
canvas { position: fixed; inset: 0; pointer-events: none; }
#leaves-canvas { z-index: 1; opacity: 0.8; }
#fire-canvas { z-index: 2; }
#universe { position: fixed; inset: 0; z-index: 5; pointer-events: auto; }
.node { position: absolute; font-family: 'Orbitron', sans-serif; font-size: 11px; color: white; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; animation: deepBreathe 8s infinite ease-in-out; opacity: 0; }
.node span { font-size: 11px; }
.node:hover { opacity: 1 !important; transform: scale(1.1); z-index: 10; animation: none !important; }
.dot { width: 7px; height: 7px; border-radius: 50%; margin-bottom: 10px; }
@keyframes deepBreathe { 0%, 100% { opacity: 0.1; filter: blur(4px); transform: scale(0.9); } 30%, 70% { opacity: 1; filter: blur(0px); transform: scale(1); } }

/* SOCIAL PANEL */
.social-panel { position: fixed; left: 40px; top: 50%; transform: translateY(-50%); z-index: 100; pointer-events: auto; }
.social-btn { position: relative; width: 70px; height: 70px; z-index: 110; cursor: pointer; border-radius: 50%; background: rgba(0,0,0,0.8); border: 2px solid var(--main); display: flex; justify-content: center; align-items: center; overflow: hidden; transition: 0.4s; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); }
.social-btn img { width: 100%; height: 100%; object-fit: cover; } 

.social-icons { position: absolute; top: 50%; left: 35px; width: 0; height: 350px; transform: translateY(-50%); display: flex; flex-direction: column; justify-content: center; gap: 15px; opacity: 0; visibility: hidden; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
.social-icons.show { opacity: 1; visibility: visible; width: 100px; left: 90px; pointer-events: auto; }

.social-icons a { width: 50px; height: 50px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; display: flex; justify-content: center; align-items: center; transition: 0.3s; backdrop-filter: blur(10px); overflow: hidden; }
.social-icons a img { width: 32px; height: 32px; object-fit: contain; filter: none; opacity: 1; transition: 0.3s; }

.yt:hover { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; transform: translateX(10px); }
.tk:hover { border-color: #00f2ea; box-shadow: 0 0 15px #00f2ea; transform: translateX(10px); }
.sc:hover { border-color: #ff5500; box-shadow: 0 0 15px #ff5500; transform: translateX(10px); }
.fb:hover { border-color: #1877f2; box-shadow: 0 0 15px #1877f2; transform: translateX(10px); }
.wa:hover { border-color: #25d366; box-shadow: 0 0 15px #25d366; transform: translateX(10px); }
.social-icons a:hover img { transform: scale(1.1); filter: drop-shadow(0 0 5px white); }

.glow-text { font-family: 'Orbitron'; font-size: 8vw; letter-spacing: 12px; background: linear-gradient(#fff, var(--main)); -webkit-background-clip: text; color: transparent; text-align: center; margin: 0; pointer-events: none; z-index: 2; position: relative; }

/* Mobile Adjustments */
@media (max-width: 768px) {
    .social-panel { left: 10px; }
    .glow-text { font-size: 12vw; }
    .social-icons.show { left: 75px; }
    #cursor-container { display: none !important; }
}
</style>
</head>
<body>

<div id="cursor-container">
    <div id="cursor-dot"></div>
    </div>

<div id="intro">
    <div class="pulse-container">
        <div class="heart-pulse"></div>
        <div class="heart-pulse pulse-2"></div>
        <div class="intro-text">WanderAeon</div>
    </div>
</div>

<canvas id="leaves-canvas"></canvas>
<canvas id="fire-canvas"></canvas>
<div id="universe"></div>

<div class="social-panel">
    <div class="social-btn" id="socialBtn"><img src="SM.gif" alt="Socials"></div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank" class="yt" data-label="YouTube"><img src="youtube.png"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank" class="tk" data-label="TikTok"><img src="tiktok.png"></a>
        <a href="https://soundcloud.com/wanderaeon" target="_blank" class="sc" data-label="SoundCloud"><img src="soundcloud.png"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank" class="fb" data-label="Facebook"><img src="facebook.png"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank" class="wa" data-label="WhatsApp"><img src="whatsapp.png"></a>
    </div>
</div>

<section style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 class="glow-text">WanderAeon</h1>
</section>

<script>
setTimeout(() => { document.body.classList.add('loaded'); }, 4500);

// --- CURSOR ALPHABETS INJECTION ---
const cursorContainer = document.getElementById("cursor-container");
const brandName = "WanderAeon";
brandName.split("").forEach((char, index) => {
    const span = document.createElement("span");
    span.innerText = char;
    span.className = "orbit-letter";
    // Har alphabet ko thora sa delay dena hai taake woh line mein ghoomein
    span.style.animationDelay = `${index * 0.12}s`; 
    cursorContainer.appendChild(span);
});

// --- VISUALS LOGIC ---
const lCanvas = document.getElementById("leaves-canvas"); const lCtx = lCanvas.getContext("2d");
const fCanvas = document.getElementById("fire-canvas"); const fCtx = fCanvas.getContext("2d");

let leaves = []; let flames = []; const leafColors = ["#cc4400", "#e6b800", "#ff6600", "#b33c00"];

function resize() { 
    lCanvas.width = fCanvas.width = window.innerWidth; 
    lCanvas.height = fCanvas.height = window.innerHeight; 
    initLeaves(); 
}

function initLeaves() {
    leaves = [];
    let count = window.innerWidth < 768 ? 20 : 45; 
    for(let i=0; i<count; i++) {
        leaves.push({ x: Math.random() * lCanvas.width, y: Math.random() * lCanvas.height, r: Math.random() * 5 + 3, color: leafColors[Math.floor(Math.random() * leafColors.length)], vx: (Math.random() - 0.5) * 1, vy: Math.random() * 0.5 + 0.3, angle: Math.random() * Math.PI * 2, isBurning: false, burnTime: 0 });
    }
}

function spawnFire(x, y) { for(let i=0; i<5; i++) flames.push({ x, y, s: Math.random()*5+2, a:1, vx:(Math.random()-.5)*2, vy:-Math.random()*3 }); }

function draw() {
    lCtx.clearRect(0,0,lCanvas.width, lCanvas.height); fCtx.clearRect(0,0,fCanvas.width, fCanvas.height);
    leaves.forEach(p => {
        lCtx.save(); lCtx.translate(p.x, p.y); lCtx.rotate(p.angle);
        if (p.isBurning) {
            p.burnTime += 1; lCtx.fillStyle = `rgba(255, ${200 - p.burnTime * 2}, 0, ${1 - p.burnTime/60})`;
            if (p.burnTime % 5 === 0) spawnFire(p.x, p.y);
            if (p.burnTime > 60) { p.isBurning = false; p.burnTime = 0; p.y = -20; }
        } else { lCtx.fillStyle = p.color; }
        lCtx.beginPath(); lCtx.moveTo(0,0); lCtx.lineTo(p.r, p.r); lCtx.lineTo(0, p.r*2); lCtx.lineTo(-p.r, p.r); lCtx.closePath(); lCtx.fill(); lCtx.restore();
        p.y += p.vy; p.x += p.vx; p.angle += 0.005;
        if(p.y > lCanvas.height) { p.y = -20; p.x = Math.random() * lCanvas.width; }
    });
    for(let i=flames.length-1; i>=0; i--) {
        let p = flames[i]; p.x += p.vx; p.y += p.vy; p.a -= 0.04;
        if(p.a <= 0) flames.splice(i, 1); else { fCtx.globalAlpha = p.a; fCtx.fillStyle = "orange"; fCtx.beginPath(); fCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); fCtx.fill(); }
    }
    requestAnimationFrame(draw);
}

// --- MOUSE & TOUCH LOGIC ---
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

if (!isTouchDevice) {
    cursorContainer.style.display = 'block';
}

addEventListener("mousemove", e => { 
    let mX = e.clientX; let mY = e.clientY;
    if (!isTouchDevice) {
        cursorContainer.style.left = mX + 'px';
        cursorContainer.style.top = mY + 'px';
    }
    spawnFire(mX, mY); 
    nodes.forEach(n => {
        const dx = mX - n.x; const dy = mY - n.y; const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 220) { n.el.style.animation = 'none'; n.el.style.opacity = 1 - (dist/220); n.el.style.filter = "blur(0px)"; } 
        else { n.el.style.animation = 'deepBreathe 8s infinite ease-in-out'; }
    });
    leaves.forEach(leaf => { if(Math.sqrt((mX-leaf.x)**2 + (mY-leaf.y)**2) < 30) leaf.isBurning = true; });
});

addEventListener("touchmove", e => {
    let tX = e.touches[0].clientX; let tY = e.touches[0].clientY;
    spawnFire(tX, tY);
    leaves.forEach(leaf => { if(Math.sqrt((tX-leaf.x)**2 + (tY-leaf.y)**2) < 30) leaf.isBurning = true; });
});

resize(); draw(); window.onresize = resize;

// --- SONGS NODES ---
const songs = [
    { name: "Wanderer", type: "red", link: "https://youtu.be/oE4C19lM4fA" },
    { name: "Untamed Shadows", type: "green", link: "https://www.youtube.com/watch?v=VQXMUNpGjjQ" },
    { name: "Before the Return", type: "green", link: "https://www.youtube.com/watch?v=0wBXdnBznY0" },
    { name: "Sunno", type: "green", link: "https://www.youtube.com/watch?v=02uImf7-wfQ" },
    { name: "Sunna hay", type: "green", link: "https://www.youtube.com/watch?v=H9HPTlYHkjQ" },
    { name: "JanEJana", type: "gold", link: "https://www.youtube.com/watch?v=twd-aJLq30U" }
];
const nodes = []; const univ = document.getElementById('universe');
songs.forEach((song) => {
    const el = document.createElement('div'); el.className = `node ${song.type}`;
    el.innerHTML = `<div class="dot"></div><span>${song.name}</span>`;
    el.onclick = () => window.open(song.link, '_blank');
    const x = 15 + Math.random() * 70; const y = 20 + Math.random() * 60;
    el.style.left = x + '%'; el.style.top = y + '%';
    univ.appendChild(el); nodes.push({ el, x: (x/100)*innerWidth, y: (y/100)*innerHeight });
});

const btn = document.getElementById("socialBtn"); const icons = document.getElementById("socialIcons");
let active = false;
btn.onclick = (e) => { e.stopPropagation(); active = !active; active ? icons.classList.add("show") : icons.classList.remove("show"); };
document.body.onclick = () => { icons.classList.remove("show"); active = false; };
</script>
</body>
</html>
