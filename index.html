<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderAeon | Human x AI Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main: #ff4500; 
            --glow: #ff9900; 
            --bg: #050505; 
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: white; 
            font-family: sans-serif; overflow: hidden; 
        }

        /* 3-LAYER PARALLAX (Using your files) */
        .parallax-wrapper { 
            position: fixed; inset: 0; z-index: -1; 
            pointer-events: none; overflow: hidden; 
        }
        .layer { 
            position: absolute; top: -15%; left: -15%; 
            width: 130%; height: 130%; 
            background-size: cover; background-position: center; 
            transition: transform 0.1s ease-out; 
            will-change: transform;
        }
        #layer1 { background-image: url('final.jpg'); z-index: 1; filter: brightness(0.4); }
        #layer2 { background-image: url('echo.jpg'); z-index: 2; opacity: 0.4; mix-blend-mode: screen; }
        #layer3 { background-image: url('dark.jpg'); z-index: 3; opacity: 0.2; }

        /* CENTER HUB */
        .hero { 
            height: 100vh; width: 100%; 
            display: flex; justify-content: center; align-items: center; 
            position: relative; 
        }
        .logo-container { position: relative; z-index: 10; text-align: center; pointer-events: none; }
        .logo-text { 
            font-family: 'Orbitron'; font-size: clamp(2.5rem, 15vw, 7.5rem); 
            font-weight: 900; letter-spacing: 12px; 
            background: linear-gradient(#fff, var(--main)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 0 20px var(--main)); 
            line-height: 1.1; margin: 0; 
        }

        /* DYNAMIC SOCIAL ORBIT */
        .social-orbit { 
            position: absolute; top: 50%; left: 50%; 
            width: clamp(320px, 55vw, 550px); height: clamp(320px, 55vw, 550px); 
            transform: translate(-50%, -50%); 
            border-radius: 50%; 
            animation: rotateOrbit 40s linear infinite; 
            pointer-events: none; 
        }
        .social-icon { 
            position: absolute; width: 50px; height: 50px; 
            background: rgba(0,0,0,0.9); border: 1px solid var(--main); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            pointer-events: auto; animation: counterRotate 40s linear infinite; 
            transition: 0.3s; text-decoration: none; 
        }
        .social-icon img { width: 24px; filter: invert(1); }
        .social-icon:hover { 
            background: var(--main); 
            box-shadow: 0 0 30px var(--main); 
            transform: scale(1.2); 
        }

        /* PRECISE ORBIT POSITIONS */
        .i1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .i2 { top: 50%; right: 0; transform: translate(50%, -50%); }
        .i3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
        .i4 { top: 50%; left: 0; transform: translate(-50%, -50%); }
        .i5 { top: 15%; right: 15%; transform: translate(50%, -50%); }

        @keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counterRotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        
        .tagline { 
            font-family: 'Orbitron'; letter-spacing: 6px; color: #ffcc66; 
            font-size: 0.75rem; margin-top: 40px; opacity: 0.8; 
        }
    </style>
</head>
<body>

    <div class="parallax-wrapper">
        <div id="layer1" class="layer"></div>
        <div id="layer2" class="layer"></div>
        <div id="layer3" class="layer"></div>
    </div>

    <section class="hero">
        <div class="logo-container">
            <h1 class="logo-text">WANDER<br>AEON</h1>
            <p class="tagline">HUMAN x AI | THE CINEMATIC UNIVERSE</p>
        </div>
        
        <div class="social-orbit">
            <a href="https://youtube.com/@WanderAeon" target="_blank" class="social-icon i1"><img src="youtube.png" alt="YT"></a>
            <a href="https://soundcloud.com/wanderaeon" target="_blank" class="social-icon i2"><img src="soundcloud.png" alt="SC"></a>
            <a href="https://facebook.com/profile.php?id=61584853409975" target="_blank" class="social-icon i3"><img src="facebook.png" alt="FB"></a>
            <a href="https://tiktok.com/@wanderaeon" target="_blank" class="social-icon i4"><img src="tiktok.png" alt="TT"></a>
            <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank" class="social-icon i5"><img src="whatsapp.png" alt="WA"></a>
        </div>
    </section>

    <script>
        // INTERACTIVE PARALLAX & ORBIT SHIFT
        document.addEventListener('mousemove', function(e) {
            var moveX = (window.innerWidth / 2 - e.clientX) / 40;
            var moveY = (window.innerHeight / 2 - e.clientY) / 40;
            
            // Layered background movement
            document.getElementById('layer1').style.transform = 'translate(' + moveX + 'px, ' + moveY + 'px)';
            document.getElementById('layer2').style.transform = 'translate(' + (moveX * 2) + 'px, ' + (moveY * 2) + 'px)';
            document.getElementById('layer3').style.transform = 'translate(' + (moveX * 3.5) + 'px, ' + (moveY * 3.5) + 'px)';
            
            // Slight orbit shift on mouse move
            document.querySelector('.social-orbit').style.marginLeft = (moveX * 0.5) + 'px';
            document.querySelector('.social-orbit').style.marginTop = (moveY * 0.5) + 'px';
        });
    </script>
</body>
</html>
