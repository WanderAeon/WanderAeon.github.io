<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WanderAeon | Not just heard, experienced</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<style>
/* Reset dimensions precisely */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root{ --main: #ff4500; --released: #00ff88; --teaser: #ff3333; --hit: #ffd700; --burn: #ffcc00; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; position: relative; }

/* FIXED BACKGROUND LAYER */
#bg-layer {
    position: fixed; 
    inset: -20px; /* Slight bleed for parallax */
    background: url('final.jpg') center/cover no-repeat;
    z-index: -1;
    will-change: transform;
}

/* NEON VISUALIZER BARS */
.visualizer-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 0 20px; z-index: 4; pointer-events: none; opacity: 0.5; }
.bar { width: 3px; height: 10px; background: var(--main); box-shadow: 0 0 10px var(--main); border-radius: 2px 2px 0 0; animation: bounce 1.5s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { height: 5px; opacity: 0.3; } 50% { height: 35px; opacity: 1; } }

/* ELASTIC ORBITAL CURSOR (Desktop Only) */
#cursor-container { position: fixed; pointer-events: none; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; display: none; }
#cursor-dot { position: absolute; width: 6px; height: 6px; background: var(--main); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--main); transition: transform 0.3s; }
.orbit-letter { position: absolute; font-family: 'Orbitron'; font-size: 13px; color: white; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 10px var(--main); will-change: transform; }

/* Hide default cursor on desktop */
@media (pointer: fine) {
    body { cursor: none; }
    a, .node, .social-btn, .social-icons a { cursor: none; }
}

/* INTRO LAYER */
#intro { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; transition: opacity 1.5s ease-out 1s; pointer-events: auto; }
.pulse-container { position: relative; display: flex; justify-content: center; align-items: center; }
.heart-pulse { position: absolute; width: 80px; height: 80px; border: 3px solid var(--main); border-radius: 50%; opacity: 0; animation: pulseAnim 1.8s infinite ease-out; }
.pulse-2 { animation-delay: 0.6s; }
.intro-text { font-family: 'Orbitron'; font-size: 18px; color: white; letter-spacing: 10px; text-transform: uppercase; z-index: 1000; opacity: 0; animation: textFade 4s forwards 0.3s; }
@keyframes pulseAnim { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
@keyframes textFade { 0% { opacity: 0; filter: blur(10px); } 30%, 70% { opacity: 1; filter: blur(0px); text-shadow: 0 0 20px var(--main); } 100% { opacity: 0; filter: blur(10px); } }
.loaded #intro { opacity: 0; pointer-events: none; }

/* VISUALS CANVAS */
canvas { position: fixed; inset: 0; pointer-events: none; }
#leaves-canvas { z-index: 1; opacity: 0.8; }
#fire-canvas { z-index: 2; }
#universe { position: fixed; inset: 0; z-index: 5; pointer-events: auto; }

/* NODES */
.node { position: absolute; font-family: 'Orbitron', sans-serif; font-size: 10px; color: white; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; animation: deepBreathe 8s infinite ease-in-out; opacity: 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; margin-bottom: 8px; }
.red .dot { background: var(--teaser); box-shadow: 0 0 10px var(--teaser); }
.green .dot { background: var(--released); box-shadow: 0 0 10px var(--released); }
.gold .dot { background: var(--hit); box-shadow: 0 0 10px var(--hit); }
@keyframes deepBreathe { 0%, 100% { opacity: 0.1; filter: blur(4px); transform: scale(0.9); } 30%, 70% { opacity: 1; filter: blur(0px); transform: scale(1); } }

/* SOCIAL PANEL */
.social-panel { position: fixed; left: 30px; top: 50%; transform: translateY(-50%); z-index: 100; pointer-events: auto; }
.social-btn { position: relative; width: 60px; height: 60px; z-index: 110; cursor: pointer; border-radius: 50%; background: rgba(0,0,0,0.8); border: 2px solid var(--main); display: flex; justify-content: center; align-items: center; overflow: hidden; transition: 0.4s; }
.social-icons { position: absolute; top: 50%; left: 35px; width: 0; height: 320px; transform: translateY(-50%); display: flex; flex-direction: column; justify-content: center; gap: 12px; opacity: 0; visibility: hidden; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
.social-icons.show { opacity: 1; visibility: visible; width: 100px; left: 80px; pointer-events: auto; }
.social-icons a { width: 45px; height: 45px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; display: flex; justify-content: center; align-items: center; transition: 0.3s; }

.glow-text { font-family: 'Orbitron'; font-size: 7vw; letter-spacing: 10px; background: linear-gradient(#fff, var(--main)); -webkit-background-clip: text; color: transparent; text-align: center; margin: 0; pointer-events: none; z-index: 2; position: relative; padding: 0 20px; }

/* MOBILE FRIENDLY FIXES */
@media (max-width: 768px) {
    #bg-layer { inset: 0; transform: none !important; } /* Disable parallax on mobile */
    .social-panel { left: 15px; }
    .glow-text { font-size: 10vw; letter-spacing: 5px; }
    #cursor-container { display: none !important; } /* No orbital cursor on touch */
    .visualizer-container { height: 50px; gap: 2px; }
    .bar { width: 2px; }
    .node { font-size: 9px; }
}
</style>
</head>
<body>

<div id="bg-layer"></div>
<div class="visualizer-container" id="visualizer"></div>

<div id="cursor-container">
    <div id="cursor-dot"></div>
</div>

<div id="intro">
    <div class="pulse-container">
        <div class="heart-pulse"></div>
        <div class="heart-pulse pulse-2"></div>
        <div class="intro-text">WanderAeon</div>
    </div>
</div>

<canvas id="leaves-canvas"></canvas>
<canvas id="fire-canvas"></canvas>
<div id="universe"></div>

<div class="social-panel">
    <div class="social-btn" id="socialBtn"><img src="SM.gif" alt="Socials" style="width:100%"></div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank"><img src="youtube.png" style="width:28px"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank"><img src="tiktok.png" style="width:28px"></a>
        <a href="https://soundcloud.com/wanderaeon" target="_blank"><img src="soundcloud.png" style="width:28px"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank"><img src="facebook.png" style="width:28px"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank"><img src="whatsapp.png" style="width:28px"></a>
    </div>
</div>

<section style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 class="glow-text">WanderAeon</h1>
</section>

<script>
setTimeout(() => { document.body.classList.add('loaded'); }, 4500);

const mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
let currentOrbitRadius = 45;

// 1. VISUALIZER
const viz = document.getElementById("visualizer");
const barCount = isTouchDevice ? 20 : 40;
for(let i=0; i<barCount; i++) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.animationDelay = `${Math.random() * 1.5}s`;
    viz.appendChild(bar);
}

// 2. CURSOR (Desktop Only)
const cursorContainer = document.getElementById("cursor-container");
const cursorDot = document.getElementById("cursor-dot");
const letters = [];
const brandName = "WanderAeon";

if (!isTouchDevice) {
    brandName.split("").forEach((char, index) => {
        const span = document.createElement("span");
        span.innerText = char;
        span.className = "orbit-letter";
        cursorContainer.appendChild(span);
        letters.push({ el: span, x: 0, y: 0, angle: (index / brandName.length) * Math.PI * 2 });
    });
}

// 3. TRACKING
const bgLayer = document.getElementById('bg-layer');
addEventListener("mousemove", e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (!isTouchDevice) {
        cursorContainer.style.display = 'block';
        cursorDot.style.left = mouse.x + 'px';
        cursorDot.style.top = mouse.y + 'px';
        
        // Parallax Effect
        const moveX = (mouse.x - window.innerWidth/2) * 0.015;
        const moveY = (mouse.y - window.innerHeight/2) * 0.015;
        bgLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;

        // Magnetic Check
        const hovered = document.elementFromPoint(mouse.x, mouse.y);
        if(hovered && (hovered.closest('.node') || hovered.closest('.social-btn') || hovered.closest('a'))) {
            currentOrbitRadius = 70;
            cursorDot.style.transform = "translate(-50%, -50%) scale(1.8)";
        } else {
            currentOrbitRadius = 45;
            cursorDot.style.transform = "translate(-50%, -50%) scale(1)";
        }
    }
    spawnFire(mouse.x, mouse.y);
    leaves.forEach(leaf => { if(Math.sqrt((mouse.x-leaf.x)**2 + (mouse.y-leaf.y)**2) < 30) leaf.isBurning = true; });
});

// Mobile Touch Support
addEventListener("touchmove", e => {
    const tX = e.touches[0].clientX; const tY = e.touches[0].clientY;
    spawnFire(tX, tY);
    leaves.forEach(leaf => { if(Math.sqrt((tX-leaf.x)**2 + (tY-leaf.y)**2) < 30) leaf.isBurning = true; });
}, {passive: true});

// 4. ANIMATION LOOP
let time = 0;
function animate() {
    time += 0.05;
    if (!isTouchDevice) {
        letters.forEach((letter, i) => {
            const orbitX = mouse.x + Math.cos(time + letter.angle) * currentOrbitRadius;
            const orbitY = mouse.y + Math.sin(time + letter.angle) * currentOrbitRadius;
            letter.x += (orbitX - letter.x) * (0.12 - (i * 0.005));
            letter.y += (orbitY - letter.y) * (0.12 - (i * 0.005));
            letter.el.style.transform = `translate(${letter.x}px, ${letter.y}px)`;
        });
    }
    requestAnimationFrame(animate);
}
animate();

// 5. CANVAS (Leaves & Fire)
const lCanvas = document.getElementById("leaves-canvas"); const lCtx = lCanvas.getContext("2d");
const fCanvas = document.getElementById("fire-canvas"); const fCtx = fCanvas.getContext("2d");
let leaves = []; let flames = []; const leafColors = ["#cc4400", "#e6b800", "#ff6600", "#b33c00"];

function resize() { lCanvas.width = fCanvas.width = window.innerWidth; lCanvas.height = fCanvas.height = window.innerHeight; initLeaves(); }
function initLeaves() {
    leaves = [];
    let count = isTouchDevice ? 15 : 40; 
    for(let i=0; i<count; i++) {
        leaves.push({ x: Math.random() * lCanvas.width, y: Math.random() * lCanvas.height, r: Math.random() * 4 + 2, color: leafColors[Math.floor(Math.random() * leafColors.length)], vx: (Math.random() - 0.5) * 1, vy: Math.random() * 0.5 + 0.3, angle: Math.random() * Math.PI * 2, isBurning: false, burnTime: 0 });
    }
}
function spawnFire(x, y) { for(let i=0; i<4; i++) flames.push({ x, y, s: Math.random()*4+2, a:1, vx:(Math.random()-.5)*2, vy:-Math.random()*2.5 }); }
function draw() {
    lCtx.clearRect(0,0,lCanvas.width, lCanvas.height); fCtx.clearRect(0,0,fCanvas.width, fCanvas.height);
    leaves.forEach(p => {
        lCtx.save(); lCtx.translate(p.x, p.y); lCtx.rotate(p.angle);
        if (p.isBurning) {
            p.burnTime += 1; lCtx.fillStyle = `rgba(255, ${200 - p.burnTime * 2}, 0, ${1 - p.burnTime/60})`;
            if (p.burnTime % 5 === 0) spawnFire(p.x, p.y);
            if (p.burnTime > 60) { p.isBurning = false; p.burnTime = 0; p.y = -20; }
        } else { lCtx.fillStyle = p.color; }
        lCtx.beginPath(); lCtx.moveTo(0,0); lCtx.lineTo(p.r, p.r); lCtx.lineTo(0, p.r*2); lCtx.lineTo(-p.r, p.r); lCtx.closePath(); lCtx.fill(); lCtx.restore();
        p.y += p.vy; p.x += p.vx; p.angle += 0.005;
        if(p.y > lCanvas.height) { p.y = -20; p.x = Math.random() * lCanvas.width; }
    });
    for(let i=flames.length-1; i>=0; i--) {
        let p = flames[i]; p.x += p.vx; p.y += p.vy; p.a -= 0.04;
        if(p.a <= 0) flames.splice(i, 1); else { fCtx.globalAlpha = p.a; fCtx.fillStyle = "orange"; fCtx.beginPath(); fCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); fCtx.fill(); }
    }
    requestAnimationFrame(draw);
}
resize(); draw(); window.onresize = resize;

// Song Nodes Setup
const songs = [
    { name: "Wanderer", type: "red", link: "https://youtu.be/oE4C19lM4fA" },
    { name: "Untamed Shadows", type: "green", link: "https://www.youtube.com/watch?v=VQXMUNpGjjQ" },
    { name: "Before the Return", type: "green", link: "https://www.youtube.com/watch?v=0wBXdnBznY0" },
    { name: "Sunno", type: "green", link: "https://www.youtube.com/watch?v=02uImf7-wfQ" },
    { name: "Sunna hay", type: "green", link: "https://www.youtube.com/watch?v=H9HPTlYHkjQ" },
    { name: "JanEJana", type: "gold", link: "https://www.youtube.com/watch?v=twd-aJLq30U" }
];
const nodes = []; const univ = document.getElementById('universe');
songs.forEach((song) => {
    const el = document.createElement('div'); el.className = `node ${song.type}`;
    el.innerHTML = `<div class="dot"></div><span>${song.name}</span>`;
    el.onclick = () => window.open(song.link, '_blank');
    const x = 15 + Math.random() * 70; const y = 20 + Math.random() * 60;
    el.style.left = x + '%'; el.style.top = y + '%';
    univ.appendChild(el); nodes.push({ el, x: (x/100)*innerWidth, y: (y/100)*innerHeight });
});

const btn = document.getElementById("socialBtn"); const icons = document.getElementById("socialIcons");
btn.onclick = (e) => { e.stopPropagation(); icons.classList.toggle("show"); };
document.body.onclick = () => { icons.classList.remove("show"); };
</script>
</body>
</html>
