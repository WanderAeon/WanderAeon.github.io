<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WanderAeon</title>

<style>
body{
margin:0;
height:100vh;
background:url('final.jpg') center/cover no-repeat;
font-family:Arial;
color:white;
overflow:hidden;
}

canvas{position:fixed;inset:0;pointer-events:none}

/* LOGO */
.center{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-size:3em;
font-weight:bold;
color:orange;
text-shadow:0 0 30px orange;
}

/* VISITOR */
.visitor{
position:fixed;
right:10px;
bottom:10px;
border:2px solid orange;
padding:8px 12px;
border-radius:12px;
background:black;
box-shadow:0 0 15px orange;
font-size:14px;
}

/* THEME BUTTONS */
.themes{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
}
.themes button{
background:black;
border:2px solid orange;
color:white;
padding:8px 14px;
border-radius:10px;
cursor:pointer;
}

/* SOCIAL */
.social{
position:fixed;
left:10px;
top:40%;
}
.social img{
width:48px;
margin:6px;
background:black;
padding:6px;
border-radius:10px;
box-shadow:0 0 10px orange;
}
</style>
</head>

<body>

<div class="themes">
<button onclick="setBG('final.jpg')">Inferno</button>
<button onclick="setBG('echo.jpg')">Echo</button>
<button onclick="setBG('dark.jpg')">Dark</button>
</div>

<div class="social">
<a href="https://www.youtube.com/@WanderAeon" target="_blank"><img src="youtube.png"></a>
<a href="https://www.tiktok.com/@wanderaeon" target="_blank"><img src="tiktok.png"></a>
<a href="https://soundcloud.com/wanderaeon" target="_blank"><img src="soundcloud.png"></a>
<a href="https://facebook.com" target="_blank"><img src="facebook.png"></a>
</div>

<div class="visitor">
Live: <span id="live">0</span><br>
Total: <span id="total">0</span>
</div>

<canvas id="fire"></canvas>

<div class="center">WanderAeon</div>

<script>
function setBG(img){
document.body.style.background=`url('${img}') center/cover no-repeat`;
}

const c=document.getElementById("fire");
const ctx=c.getContext("2d");

function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;

let p=[];
function spawn(x,y){
for(let i=0;i<4;i++)p.push({x,y,a:1,vx:(Math.random()-.5)*2,vy:-Math.random()*2});
}

addEventListener("mousemove",e=>spawn(e.clientX,e.clientY));
addEventListener("touchmove",e=>spawn(e.touches[0].clientX,e.touches[0].clientY));

function draw(){
ctx.clearRect(0,0,c.width,c.height);
p.forEach((f,i)=>{
f.x+=f.vx;f.y+=f.vy;f.a-=0.03;
ctx.globalAlpha=f.a;
ctx.fillStyle="orange";
ctx.beginPath();
ctx.arc(f.x,f.y,5,0,Math.PI*2);
ctx.fill();
if(f.a<=0)p.splice(i,1);
});
requestAnimationFrame(draw);
}
draw();
</script>

<!-- FIREBASE REALTIME -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, set, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const app = initializeApp({
apiKey:"AIzaSyDI3SSJh4RzJ33kzxwWQyKrpp_0FXT-gGE",
databaseURL:"https://visitorlog-87a3b-default-rtdb.firebaseio.com"
});

const db=getDatabase(app);
const user="user_"+Math.random().toString(36).slice(2);

const liveRef=ref(db,"live/"+user);
set(liveRef,true);
onDisconnect(liveRef).remove();

const liveCountRef=ref(db,"live");
const totalRef=ref(db,"total");

runTransaction(totalRef,n=>(n||0)+1);

onValue(liveCountRef,s=>{
document.getElementById("live").innerText=s.size;
});

onValue(totalRef,s=>{
document.getElementById("total").innerText=s.val()||0;
});
</script>

</body>
</html>
