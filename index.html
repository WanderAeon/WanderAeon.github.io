<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>WanderAeon</title>

<style>
*{margin:0;padding:0}
html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Arial;
touch-action:none;
}

/* BACKGROUND */
#bg{
position:fixed;
inset:0;
background:url("final.jpg") center/cover no-repeat;
z-index:0;
}

/* CANVAS */
canvas{
position:fixed;
inset:0;
z-index:1;
pointer-events:none;
}

/* LOGO */
#logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:clamp(40px,8vw,80px);
color:#ff9b00;
text-shadow:0 0 25px orange,0 0 80px red;
z-index:3;
animation:pulse 2s infinite;
}
@keyframes pulse{
50%{transform:translate(-50%,-50%) scale(1.08);}
}

/* THEMES */
#themes{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
z-index:4;
}

.theme{
padding:10px 18px;
border-radius:14px;
border:2px solid orange;
background:rgba(0,0,0,.6);
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 15px orange;
}

/* SOCIAL */
.social{
position:fixed;
left:15px;
bottom:20px;
z-index:4;
}

.social img{width:60px;cursor:pointer;}

.icons{
display:flex;
gap:10px;
margin-top:10px;
opacity:0;
transition:.4s;
pointer-events:none;
}

.icons.show{
opacity:1;
pointer-events:auto;
}

.icons img{
width:44px;
background:rgba(0,0,0,.6);
padding:6px;
border-radius:12px;
}
</style>
</head>

<body>

<div id="bg"></div>

<canvas id="fire"></canvas>
<canvas id="trail"></canvas>

<div id="logo">WanderAeon</div>

<div id="themes">
<div class="theme" onclick="setBg('final.jpg')">Inferno</div>
<div class="theme" onclick="setBg('echo.jpg')">Echo</div>
<div class="theme" onclick="setBg('dark.jpg')">Dark</div>
</div>

<div class="social">
<img src="SM.gif" id="btn">
<div class="icons" id="icons">
<img src="youtube.png">
<img src="tiktok.png">
<img src="soundcloud.png">
<img src="facebook.png">
<img src="whatsapp.png">
</div>
</div>

<script>
/* THEME SWITCH */
function setBg(img){
document.getElementById("bg").style.background=
`url(${img}) center/cover no-repeat`;
}

/* SOCIAL */
const btn=document.getElementById("btn");
const icons=document.getElementById("icons");
let t;
btn.onclick=()=>{
icons.classList.add("show");
clearTimeout(t);
t=setTimeout(()=>icons.classList.remove("show"),3000);
};

/* CANVAS SETUP */
const fire=document.getElementById("fire");
const f=fire.getContext("2d");
const trail=document.getElementById("trail");
const tr=trail.getContext("2d");

function resize(){
fire.width=trail.width=innerWidth;
fire.height=trail.height=innerHeight;
}
resize(); onresize=resize;

/* REAL FIRE */
let flames=[];

function spawn(x,y){
for(let i=0;i<6;i++){
flames.push({
x,y,
vx:(Math.random()-.5)*1.5,
vy:-Math.random()*3,
life:1,
s:Math.random()*6+4
});
}
}

function drawFire(){
f.clearRect(0,0,fire.width,fire.height);
for(let i=flames.length-1;i>=0;i--){
let p=flames[i];
p.x+=p.vx;
p.y+=p.vy;
p.life-=.03;
if(p.life<=0){flames.splice(i,1);continue;}

f.globalAlpha=p.life;
let g=f.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s);
g.addColorStop(0,"#fff8");
g.addColorStop(.4,"orange");
g.addColorStop(1,"red");
f.fillStyle=g;
f.beginPath();
f.arc(p.x,p.y,p.s,0,Math.PI*2);
f.fill();
}
f.globalAlpha=1;
requestAnimationFrame(drawFire);
}

/* TRAIL */
function fade(){
tr.fillStyle="rgba(0,0,0,.18)";
tr.fillRect(0,0,trail.width,trail.height);
requestAnimationFrame(fade);
}

function trailDot(x,y){
tr.fillStyle="rgba(255,160,0,.5)";
tr.beginPath();
tr.arc(x,y,10,0,Math.PI*2);
tr.fill();
}

/* EVENTS */
function move(x,y){
spawn(x,y);
trailDot(x,y);
}

addEventListener("mousemove",e=>move(e.clientX,e.clientY));
addEventListener("touchmove",e=>{
let t=e.touches[0];
move(t.clientX,t.clientY);
},{passive:true});

drawFire();
fade();
</script>

</body>
</html>
