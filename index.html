<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderAeon | Human x AI</title>
<link href="" rel="stylesheet">
<style>
:root { --main: #ff4500; --bg: #050505; }
body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: white; overflow: hidden; font-family: 'Orbitron', sans-serif; }
.parallax-wrapper { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.layer { position: absolute; inset: -15%; background-size: cover; background-position: center; transition: transform 0.1s ease-out; }
#layer1 { background-image: url('final.jpg'); z-index: 1; filter: brightness(0.4); }
#layer2 { background-image: url('echo.jpg'); z-index: 2; opacity: 0.4; mix-blend-mode: screen; }
#layer3 { background-image: url('dark.jpg'); z-index: 3; opacity: 0.2; }
.hero { height: 100vh; width: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
.logo-text { font-size: clamp(2rem, 10vw, 7rem); letter-spacing: 15px; background: linear-gradient(#fff, var(--main)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px var(--main)); text-align: center; line-height: 1.1; margin: 0; z-index: 10; }
.social-orbit { position: absolute; top: 50%; left: 50%; width: clamp(300px, 60vw, 500px); height: clamp(300px, 60vw, 500px); transform: translate(-50%, -50%); border-radius: 50%; animation: rot 35s linear infinite; pointer-events: none; }
.social-icon { position: absolute; width: 50px; height: 50px; background: rgba(0,0,0,0.9); border: 2px solid var(--main); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto; animation: crot 35s linear infinite; transition: 0.3s; }
.social-icon img { width: 25px; filter: invert(1); }
.social-icon:hover { background: var(--main); box-shadow: 0 0 30px var(--main); transform: scale(1.3); }
.i1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
.i2 { top: 50%; right: 0; transform: translate(50%, -50%); }
.i3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
.i4 { top: 50%; left: 0; transform: translate(-50%, -50%); }
.i5 { top: 15%; right: 15%; transform: translate(50%, -50%); }
@keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes crot { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
.tagline { letter-spacing: 5px; color: #ffcc66; font-size: 14px; margin-top: 20px; text-align: center; opacity: 0.8; }
</style>
</head>
<body>
<div class="parallax-wrapper">
<div id="layer1" class="layer"></div>
<div id="layer2" class="layer"></div>
<div id="layer3" class="layer"></div>
</div>
<div class="hero">
<div style="z-index: 10; text-align: center;">
<h1 class="logo-text">WANDER


AEON</h1>
<p class="tagline">HUMAN x AI</p>
</div>
<div class="social-orbit">
<a href="" target="_blank" class="social-icon i1"><img src="youtube.png"></a>
<a href="" target="_blank" class="social-icon i2"><img src="soundcloud.png"></a>
<a href="" target="_blank" class="social-icon i3"><img src="facebook.png"></a>
<a href="" target="_blank" class="social-icon i4"><img src="tiktok.png"></a>
<a href="" target="_blank" class="social-icon i5"><img src="whatsapp.png"></a>
</div>
</div>
<script>
window.onmousemove = function(e) {
var x = (window.innerWidth / 2 - e.clientX) / 40;
var y = (window.innerHeight / 2 - e.clientY) / 40;
document.getElementById('layer1').style.transform = 'translate(' + x + 'px, ' + y + 'px) scale(1.1)';
document.getElementById('layer2').style.transform = 'translate(' + (x * 2) + 'px, ' + (y * 2) + 'px) scale(1.1)';
document.getElementById('layer3').style.transform = 'translate(' + (x * 3) + 'px, ' + (y * 3) + 'px) scale(1.1)';
};
</script>
</body>
</html>
