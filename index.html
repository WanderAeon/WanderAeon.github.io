<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderAeon | Music Beyond Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
    --main: #ff4500;
    --glow: #ff9900;
    --soft: #ffcc66;
}

html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    font-family: 'Inter', sans-serif;
    color: white;
    background: #050505 url('final.jpg') center/cover no-repeat fixed;
    scroll-behavior: smooth;
}

/* INTRO PORTAL */
#intro {
    position: fixed; inset: 0; background: black;
    display: flex; justify-content: center; align-items: center; z-index: 999;
    animation: fadeOut 3s forwards 1s;
}
.portal {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle, #fff, var(--main), #000);
    box-shadow: 0 0 40px orange, 0 0 150px red;
    animation: expand 3s forwards;
}
@keyframes expand { 0% { transform: scale(0) } 100% { transform: scale(80); opacity: 0 } }
@keyframes fadeOut { 0%, 80% { opacity: 1 } 100% { opacity: 0; pointer-events: none } }

/* CANVAS FX */
canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

/* NAVIGATION & THEMES */
.theme-buttons {
    position: fixed; top: 20px; right: 20px;
    display: flex; gap: 8px; z-index: 10;
}
.theme-btn {
    padding: 6px 12px; background: rgba(0,0,0,0.4);
    backdrop-filter: blur(5px); border: 1px solid var(--glow);
    color: white; border-radius: 4px; cursor: pointer;
    font-family: 'Orbitron', sans-serif; font-size: 9px;
    letter-spacing: 1px; transition: 0.3s;
}
.theme-btn:hover { background: var(--main); box-shadow: 0 0 15px var(--main); }

/* --- DYNAMIC SOCIAL ORBIT PANEL --- */
.social-panel { 
    position: fixed; left: 40px; top: 50%; 
    transform: translateY(-50%); z-index: 100; 
}

/* Central SM.gif Button */
.social-btn { 
    position: relative; width: 60px; height: 60px; 
    z-index: 102; cursor: pointer;
}
.social-btn img { 
    width: 100%; transition: 0.5s; 
    filter: drop-shadow(0 0 15px var(--main)); 
}

/* The Orbit Circle (Invisible by default) */
.social-icons {
    position: absolute; top: 50%; left: 50%;
    width: 180px; height: 180px;
    margin: -90px 0 0 -90px;
    border-radius: 50%;
    border: 1px solid rgba(255, 69, 0, 0.2);
    opacity: 0; visibility: hidden;
    transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform: rotate(-90deg) scale(0.5);
    z-index: 101;
}

/* Show Orbit on Class */
.social-icons.show {
    opacity: 1; visibility: visible;
    transform: rotate(0deg) scale(1);
    animation: slowSpin 20s linear infinite;
}

@keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Icons inside Orbit */
.social-icons a {
    position: absolute; width: 35px; height: 35px;
    background: rgba(0,0,0,0.85); border: 1px solid var(--main);
    border-radius: 50%; display: flex; justify-content: center; align-items: center;
    transition: 0.3s;
}
.social-icons img { width: 18px; filter: invert(1); padding: 0 !important; border: none !important; background: transparent !important; }
.social-icons a:hover { background: var(--main); box-shadow: 0 0 20px var(--main); transform: scale(1.2); }

/* Icon Positions in Circle */
.i1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
.i2 { top: 50%; right: 0; transform: translate(50%, -50%); }
.i3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
.i4 { top: 50%; left: 0; transform: translate(-50%, -50%); }
.i5 { top: 15%; right: 15%; transform: translate(50%, -50%); }

/* SECTIONS */
section {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    position: relative; z-index: 2; text-align: center;
}

/* HERO */
.glow-text {
    font-family: 'Orbitron', sans-serif; font-size: clamp(2.5em, 10vw, 5em);
    font-weight: bold; letter-spacing: 8px;
    background: linear-gradient(90deg, var(--main), var(--glow), var(--soft));
    -webkit-background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255, 69, 0, 0.4);
}
.tagline {
    font-size: clamp(0.8em, 3vw, 1.2em); letter-spacing: 4px;
    color: var(--soft); margin-top: 10px; text-transform: uppercase;
}

/* STORY BOX */
.story-box {
    max-width: 700px; width: 85%;
    background: rgba(0,0,0,0.6); padding: 40px;
    border-left: 3px solid var(--main); backdrop-filter: blur(12px);
    margin: 50px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.story-box p { font-size: 1.1em; line-height: 1.8; color: #ccc; margin-bottom: 20px; text-align: left; }
.highlight { color: var(--glow); font-weight: bold; }

.back-to-top {
    margin-top: 20px; cursor: pointer; font-family: 'Orbitron', sans-serif;
    font-size: 10px; color: var(--soft); text-decoration: none;
}
</style>
</head>

<body>

<div id="intro"><div class="portal"></div></div>

<canvas id="embers"></canvas>
<canvas id="fire"></canvas>

<div class="theme-buttons">
    <button class="theme-btn" onclick="setTheme('inferno')">INFERNO</button>
    <button class="theme-btn" onclick="setTheme('echo')">ECHO</button>
    <button class="theme-btn" onclick="setTheme('dark')">DARK</button>
</div>

<div class="social-panel">
    <div class="social-btn" id="socialBtn">
        <img src="SM.gif" alt="Socials">
    </div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank" class="i1"><img src="youtube.png"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank" class="i2"><img src="tiktok.png"></a>
        <a href="https://soundcloud.com/wanderaeon" target="_blank" class="i3"><img src="soundcloud.png"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank" class="i4"><img src="facebook.png"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank" class="i5"><img src="whatsapp.png"></a>
    </div>
</div>

<section id="home">
    <h1 class="glow-text">WanderAeon</h1>
    <p class="tagline">Not Just Heard — Experienced</p>
    <a href="#about" style="text-decoration:none; color:white;">
        <div style="font-family:'Orbitron'; font-size:10px; letter-spacing:2px; color:var(--glow); margin-top:50px;">ENTER THE VOID</div>
    </a>
</section>

<section id="about">
    <div class="story-box">
        <p>WanderAeon is a <span class="highlight">dark cinematic music universe</span> where sound meets story.</p>
        <p>Blending dark rock, atmospheric pop, and cyberpunk elements, WanderAeon is shaping a world of human emotion.</p>
        <a href="#home" class="back-to-top">▲ BACK TO TOP</a>
    </div>
</section>

<script>
const bg=document.getElementById("embers");
const fire=document.getElementById("fire");
const bctx=bg.getContext("2d");
const fctx=fire.getContext("2d");

function resize(){
    bg.width=fire.width=innerWidth;
    bg.height=fire.height=innerHeight;
}
resize();
onresize=resize;

// Embers
let embers=[];
for(let i=0;i<120;i++)
    embers.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*2.5});

function animateBG(){
    bctx.clearRect(0,0,innerWidth,innerHeight);
    for(let e of embers){
        e.y+=0.5; if(e.y>innerHeight)e.y=0;
        bctx.fillStyle="rgba(255,150,0,.7)";
        bctx.beginPath(); bctx.arc(e.x,e.y,e.s,0,Math.PI*2); bctx.fill();
    }
    requestAnimationFrame(animateBG);
}

// Fire Trail
let flames=[];
function spawn(x,y){
    for(let i=0;i<4;i++)
    flames.push({x,y,s:Math.random()*5+2,a:1,vx:(Math.random()-.5)*1.5,vy:-Math.random()*2});
}
addEventListener("mousemove",e=>spawn(e.clientX,e.clientY));

function animateFire(){
    fctx.clearRect(0,0,innerHeight?innerWidth:0,innerHeight);
    for(let i=flames.length-1;i>=0;i--){
        let p=flames[i]; p.x+=p.vx; p.y+=p.vy; p.a-=.04;
        if(p.a<=0) flames.splice(i,1);
        else{ fctx.globalAlpha=p.a; fctx.fillStyle="orange"; fctx.beginPath(); fctx.arc(p.x,p.y,p.s,0,Math.PI*2); fctx.fill(); }
    }
    fctx.globalAlpha=1;
    requestAnimationFrame(animateFire);
}

function setTheme(t){
    const images = {'inferno': 'final.jpg', 'echo': 'echo.jpg', 'dark': 'dark.jpg'};
    document.body.style.backgroundImage=`url('${images[t]}')`;
}

// Social Toggle with Orbit Logic
const btn=document.getElementById("socialBtn");
const icons=document.getElementById("socialIcons");
let timer;

function toggleIcons(){
    icons.classList.add("show");
    clearTimeout(timer);
    timer=setTimeout(()=>icons.classList.remove("show"),5000);
}
btn.onclick=toggleIcons;
btn.onmouseenter=toggleIcons;

animateBG();
animateFire();
</script>

</body>
</html>
