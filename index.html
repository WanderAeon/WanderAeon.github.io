<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderAeon | Music Beyond Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{ --main: #ff4500; --glow: #ff9900; --soft: #ffcc66; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; color: white; background: #050505 url('final.jpg') center/cover no-repeat fixed; scroll-behavior: smooth; }
#intro { position: fixed; inset: 0; background: black; display: flex; justify-content: center; align-items: center; z-index: 999; animation: fadeOut 3s forwards 1s; }
.portal { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--main), #000); box-shadow: 0 0 40px orange, 0 0 150px red; animation: expand 3s forwards; }
@keyframes expand { 0% { transform: scale(0) } 100% { transform: scale(80); opacity: 0 } }
@keyframes fadeOut { 0%, 80% { opacity: 1 } 100% { opacity: 0; pointer-events: none } }
canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

/* SOCIAL ORBIT PANEL FIX */
.social-panel { position: fixed; left: 50px; top: 50%; transform: translateY(-50%); z-index: 100; }
.social-btn { position: relative; width: 65px; height: 65px; z-index: 105; cursor: pointer; }
.social-btn img { width: 100%; filter: drop-shadow(0 0 15px var(--main)); transition: 0.4s; }
.social-icons { position: absolute; top: 50%; left: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; opacity: 0; visibility: hidden; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform: rotate(-90deg) scale(0.3); z-index: 104; }
.social-icons.show { opacity: 1; visibility: visible; transform: rotate(0deg) scale(1); animation: slowSpin 25s linear infinite; }
@keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.social-icons a { position: absolute; width: 45px; height: 45px; background: rgba(0,0,0,0.9); border: 1.5px solid var(--main); border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.3s; overflow: hidden; }
.social-icons img { width: 24px !important; height: 24px !important; filter: invert(1); object-fit: contain; }
.social-icons a:hover { background: var(--main); box-shadow: 0 0 25px var(--main); transform: scale(1.2); }

/* Orbit Positions */
.i1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
.i2 { top: 50%; right: 0; transform: translate(50%, -50%); }
.i3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
.i4 { top: 50%; left: 0; transform: translate(-50%, -50%); }
.i5 { top: 18%; right: 18%; transform: translate(50%, -50%); }

.glow-text { font-family: 'Orbitron', sans-serif; font-size: clamp(2.5em, 10vw, 5em); font-weight: bold; letter-spacing: 8px; background: linear-gradient(90deg, var(--main), var(--glow), var(--soft)); -webkit-background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(255, 69, 0, 0.4); }
.tagline { font-size: clamp(0.8em, 3vw, 1.2em); letter-spacing: 4px; color: var(--soft); margin-top: 10px; text-transform: uppercase; }
.story-box { max-width: 700px; width: 85%; background: rgba(0,0,0,0.6); padding: 40px; border-left: 3px solid var(--main); backdrop-filter: blur(12px); margin: 50px 0; }
</style>
</head>
<body>
<div id="intro"><div class="portal"></div></div>
<canvas id="embers"></canvas>
<canvas id="fire"></canvas>

<div class="social-panel">
    <div class="social-btn" id="socialBtn"><img src="SM.gif" alt="Socials"></div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank" class="i1"><img src="youtube.png"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank" class="i2"><img src="tiktok.png"></a>
        <a href="https://soundcloud.com/@wanderaeon" target="_blank" class="i3"><img src="soundcloud.png"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank" class="i4"><img src="facebook.png"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank" class="i5"><img src="whatsapp.png"></a>
    </div>
</div>

<section id="home">
    <h1 class="glow-text">WanderAeon</h1>
    <p class="tagline">Not Just Heard — Experienced</p>
</section>

<script>
const bg=document.getElementById("embers"); const fire=document.getElementById("fire");
const bctx=bg.getContext("2d"); const fctx=fire.getContext("2d");
function resize(){ bg.width=fire.width=innerWidth; bg.height=fire.height=innerHeight; }
resize(); onresize=resize;
let embers=[]; for(let i=0;i<120;i++) embers.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*2.5});
function animateBG(){ bctx.clearRect(0,0,innerWidth,innerHeight); for(let e of embers){ e.y+=0.5; if(e.y>innerHeight)e.y=0; bctx.fillStyle="rgba(255,150,0,.7)"; bctx.beginPath(); bctx.arc(e.x,e.y,e.s,0,Math.PI*2); bctx.fill(); } requestAnimationFrame(animateBG); }
let flames=[]; function spawn(x,y){ for(let i=0;i<4;i++) flames.push({x,y,s:Math.random()*5+2,a:1,vx:(Math.random()-.5)*1.5,vy:-Math.random()*2}); }
addEventListener("mousemove",e=>spawn(e.clientX,e.clientY));
function animateFire(){ fctx.clearRect(0,0,innerWidth,innerHeight); for(let i=flames.length-1;i>=0;i--){ let p=flames[i]; p.x+=p.vx; p.y+=p.vy; p.a-=.04; if(p.a<=0) flames.splice(i,1); else{ fctx.globalAlpha=p.a; fctx.fillStyle="orange"; fctx.beginPath(); fctx.arc(p.x,p.y,p.s,0,Math.PI*2); fctx.fill(); } } fctx.globalAlpha=1; requestAnimationFrame(animateFire); }
const btn=document.getElementById("socialBtn"); const icons=document.getElementById("socialIcons");
function toggle(){ icons.classList.add("show"); setTimeout(()=>icons.classList.remove("show"),6000); }
btn.onclick=toggle; btn.onmouseenter=toggle;
animateBG(); animateFire();
</script>
</body>
</html>
