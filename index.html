<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderAeon</title>

<style>
:root{
--main:#ff4500;
--glow:#ff9900;
--soft:#ffcc66;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
color:white;
background:url('final.jpg') center/cover no-repeat;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
animation:fadeOut 4s forwards;
}

.portal{
width:40px;height:40px;border-radius:50%;
background:radial-gradient(circle,#fff,#ff6a00,#000);
box-shadow:0 0 40px orange,0 0 150px red;
animation:expand 4s forwards;
}

@keyframes expand{
0%{transform:scale(0)}
100%{transform:scale(60);opacity:0}
}
@keyframes fadeOut{
0%,80%{opacity:1}
100%{opacity:0;pointer-events:none}
}

/* CANVAS */
canvas{
position:fixed;
inset:0;
pointer-events:none;
}

/* VISITOR LOG */
.visitor-box{
position:fixed;
top:15px;
right:15px;
z-index:10;
padding:14px 18px;
border:2px solid orange;
border-radius:14px;
background:rgba(0,0,0,.65);
box-shadow:0 0 18px orange;
text-align:center;
font-weight:bold;
}

.visitor-box span{
display:block;
color:#ffb347;
margin-top:4px;
}

/* THEME BUTTONS */
.theme-buttons{
position:fixed;
top:12px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:12px;
z-index:6;
}

.theme-btn{
padding:10px 18px;
background:rgba(0,0,0,.6);
border-radius:12px;
border:2px solid orange;
color:white;
cursor:pointer;
font-weight:bold;
box-shadow:0 0 12px orange;
}

/* SOCIAL PANEL */
.social-panel{
position:fixed;
left:15px;
top:25%;
z-index:5;
transform:scale(1.25);
}

.social-btn img{
width:60px;
cursor:pointer;
filter:drop-shadow(0 0 12px orange);
}

.social-icons{
margin-top:14px;
display:flex;
flex-direction:column;
gap:12px;
opacity:0;
transform:translateX(-40px);
pointer-events:none;
transition:.4s;
}

.social-icons.show{
opacity:1;
transform:translateX(0);
pointer-events:auto;
}

.social-icons img{
width:46px;
padding:8px;
border-radius:12px;
background:rgba(0,0,0,.7);
}

/* CENTER LOGO */
section{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
z-index:2;
}

.glow-text{
font-size:3em;
font-weight:bold;
background:linear-gradient(90deg,var(--main),var(--glow),var(--soft));
-webkit-background-clip:text;
color:transparent;
animation:fire 1.5s infinite alternate;
text-shadow:0 0 25px orange;
}

@keyframes fire{
from{background-position:0%}
to{background-position:100%}
}

@media(max-width:768px){
.glow-text{font-size:2.2em;}
}
</style>
</head>

<body>

<div id="intro"><div class="portal"></div></div>

<!-- VISITOR LOG -->
<div class="visitor-box">
Live Visitors
<span>33</span>
Total Visitors
<span>600</span>
</div>

<canvas id="embers"></canvas>
<canvas id="fire"></canvas>

<!-- THEME BUTTONS -->
<div class="theme-buttons">
<button class="theme-btn" onclick="setTheme('inferno')">Inferno</button>
<button class="theme-btn" onclick="setTheme('echo')">Echo</button>
<button class="theme-btn" onclick="setTheme('dark')">Dark</button>
</div>

<!-- SOCIAL -->
<div class="social-panel">

<div class="social-btn" id="socialBtn">
<img src="SM.gif">
</div>

<div class="social-icons" id="socialIcons">
<a href="https://www.youtube.com/@WanderAeon" target="_blank"><img src="youtube.png"></a>
<a href="https://www.tiktok.com/@wanderaeon" target="_blank"><img src="tiktok.png"></a>
<a href="https://soundcloud.com/wanderaeon" target="_blank"><img src="soundcloud.png"></a>
<a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank"><img src="facebook.png"></a>
<a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank"><img src="whatsapp.png"></a>
</div>

</div>

<section>
<h1 class="glow-text">WanderAeon</h1>
</section>

<script>
const bg=document.getElementById("embers");
const fire=document.getElementById("fire");
const bctx=bg.getContext("2d");
const fctx=fire.getContext("2d");

function resize(){
bg.width=fire.width=innerWidth;
bg.height=fire.height=innerHeight;
}
resize(); onresize=resize;

/* EMBERS */
let embers=[];
for(let i=0;i<120;i++)
embers.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*2.5});

function animateBG(){
bctx.clearRect(0,0,innerWidth,innerHeight);
for(let e of embers){
e.y+=0.5;
if(e.y>innerHeight)e.y=0;
bctx.fillStyle="rgba(255,150,0,.7)";
bctx.beginPath();
bctx.arc(e.x,e.y,e.s,0,Math.PI*2);
bctx.fill();
}
requestAnimationFrame(animateBG);
}

/* FIRE TRAIL */
let flames=[];
function spawn(x,y){
for(let i=0;i<4;i++)
flames.push({
x,y,s:Math.random()*5+2,a:1,
vx:(Math.random()-.5)*1.5,
vy:-Math.random()*2
});
}

addEventListener("mousemove",e=>spawn(e.clientX,e.clientY));
addEventListener("touchmove",e=>{
let t=e.touches[0];
spawn(t.clientX,t.clientY);
},{passive:true});

function animateFire(){
fctx.clearRect(0,0,innerWidth,innerHeight);
for(let i=flames.length-1;i>=0;i--){
let p=flames[i];
p.x+=p.vx;
p.y+=p.vy;
p.a-=.04;
if(p.a<=0)flames.splice(i,1);
else{
fctx.globalAlpha=p.a;
fctx.fillStyle="orange";
fctx.beginPath();
fctx.arc(p.x,p.y,p.s,0,Math.PI*2);
fctx.fill();
}
}
fctx.globalAlpha=1;
requestAnimationFrame(animateFire);
}

/* THEMES */
function setTheme(t){
if(t=="inferno") document.body.style.backgroundImage="url('final.jpg')";
if(t=="echo") document.body.style.backgroundImage="url('echo.jpg')";
if(t=="dark") document.body.style.backgroundImage="url('dark.jpg')";
}

/* SOCIAL AUTO HIDE */
const btn=document.getElementById("socialBtn");
const icons=document.getElementById("socialIcons");
let timer;

function showIcons(){
icons.classList.add("show");
clearTimeout(timer);
timer=setTimeout(()=>icons.classList.remove("show"),3000);
}

btn.onclick=showIcons;
btn.onmouseenter=showIcons;
icons.onmouseenter=()=>clearTimeout(timer);
icons.onmouseleave=()=>timer=setTimeout(()=>icons.classList.remove("show"),3000);

animateBG();
animateFire();
</script>

</body>
</html>
