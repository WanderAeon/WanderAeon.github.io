<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderAeon | Human x AI Experience</title>
<link href="" rel="stylesheet">
<style>
:root { --main: #ff4500; --glow: #ff9900; --soft: #ffcc66; --bg-dark: #050505; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
.parallax-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; overflow: hidden; }
.layer { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; background-position: center; background-size: cover; background-repeat: no-repeat; transition: transform 0.15s ease-out; }
#layer1 { background-image: url('final.jpg'); z-index: 1; filter: brightness(0.4); }
#layer2 { background-image: url('echo.jpg'); z-index: 2; opacity: 0.4; mix-blend-mode: screen; }
#layer3 { background-image: url('dark.jpg'); z-index: 3; opacity: 0.2; }
.hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; z-index: 10; }
.logo-container { position: relative; display: flex; justify-content: center; align-items: center; }
.logo-text { font-family: 'Orbitron', sans-serif; font-size: clamp(2.5rem, 18vw, 7.5rem); font-weight: 900; letter-spacing: 15px; text-align: center; line-height: 1.1; background: linear-gradient(to bottom, #fff, var(--main)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px var(--main)); animation: breathe 5s infinite alternate; }
@keyframes breathe { 0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 15px var(--main)); } 100% { transform: scale(1.03); filter: brightness(1.3) drop-shadow(0 0 35px var(--glow)); } }
.social-orbit { position: absolute; width: clamp(280px, 65vw, 500px); height: clamp(280px, 65vw, 500px); border-radius: 50%; border: 1px rgba(255,255,255,0.05) solid; animation: rotateOrbit 30s linear infinite; }
.social-icon { position: absolute; width: 45px; height: 45px; background: rgba(0,0,0,0.9); border: 1px solid var(--main); border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.4s; animation: counterRotate 30s linear infinite; }
.social-icon img { width: 22px; filter: invert(1); }
.social-icon:hover { background: var(--main); box-shadow: 0 0 25px var(--main); transform: scale(1.3); }
.i1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
.i2 { top: 50%; right: 0; transform: translate(50%, -50%); }
.i3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
.i4 { top: 50%; left: 0; transform: translate(-50%, -50%); }
.i5 { top: 15%; right: 15%; }
@keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes counterRotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
.section { min-height: 100vh; padding: 120px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5,5,5,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,69,0,0.3); position: relative; z-index: 20; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; width: 100%; max-width: 1100px; }
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 50px 30px; border-radius: 20px; transition: 0.4s; text-align: center; }
.card:hover { background: rgba(255,69,0,0.08); border-color: var(--main); transform: translateY(-12px); }
.cinematic-btn { background: transparent; border: 1px solid var(--main); color: var(--main); padding: 12px 25px; font-family: 'Orbitron'; font-size: 11px; text-decoration: none; letter-spacing: 2px; border-radius: 5px; transition: 0.4s; display: inline-block; margin-top: 25px; }
.cinematic-btn:hover { background: var(--main); color: white; box-shadow: 0 0 20px var(--main); }
.tagline { font-family: 'Orbitron'; letter-spacing: 6px; color: var(--soft); font-size: 0.75rem; margin-top: 30px; opacity: 0.8; }
</style>
</head>
<body>
<div class="parallax-wrapper">
<div id="layer1" class="layer"></div>
<div id="layer2" class="layer"></div>
<div id="layer3" class="layer"></div>
</div>
<section class="hero">
<div class="logo-container">
<h1 class="logo-text">WANDER


AEON</h1>
<div class="social-orbit">
<a href="" target="_blank" class="social-icon i1"><img src="youtube.png"></a>
<a href="" target="_blank" class="social-icon i2"><img src="soundcloud.png"></a>
<a href="" target="_blank" class="social-icon i3"><img src="facebook.png"></a>
<a href="" target="_blank" class="social-icon i4"><img src="tiktok.png"></a>
<a href="" target="_blank" class="social-icon i5"><img src="whatsapp.png"></a>
</div>
</div>
<p class="tagline">HUMAN x AI | THE CINEMATIC UNIVERSE</p>
</section>
<section class="section">
<div class="grid">
<div class="card">
<h3 style="font-family: 'Orbitron'; color: var(--glow);">DISCOGRAPHY</h3>
<p>Ambient, electronic, and cinematic sounds.</p>
<a href="" target="_blank" class="cinematic-btn">OPEN SOUNDCLOUD</a>
</div>
<div class="card">
<h3 style="font-family: 'Orbitron'; color: var(--glow);">VISUALS</h3>
<p>The cinematic evolution of WanderAeon.</p>
<a href="" target="_blank" class="cinematic-btn">WATCH YOUTUBE</a>
</div>
</div>
</section>
<script>
document.addEventListener('mousemove', (e) => {
const x = (window.innerWidth / 2 - e.pageX) / 45;
const y = (window.innerHeight / 2 - e.pageY) / 45;
document.getElementById('layer1').style.transform = translateX(${x}px) translateY(${y}px) scale(1.1);
document.getElementById('layer2').style.transform = translateX(${x * 2.2}px) translateY(${y * 2.2}px) scale(1.1);
document.getElementById('layer3').style.transform = translateX(${x * 3.5}px) translateY(${y * 3.5}px) scale(1.1);
});
window.addEventListener('scroll', () => {
const scrolled = window.scrollY;
const logo = document.querySelector('.logo-text');
const orbit = document.querySelector('.social-orbit');
logo.style.transform = scale(${1 + scrolled/800});
logo.style.opacity = ${1 - scrolled/600};
orbit.style.opacity = ${1 - scrolled/400};
});
</script>
</body>
</html>
