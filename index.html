<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderAeon</title>

<style>
:root{
--main:#ff4500;
--glow:#ff9900;
--soft:#ffcc66;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
color:white;
background:url('final.jpg') center/cover no-repeat;
}

/* 🔥 INTRO */
#intro{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
animation:fadeOut 3s forwards;
}

.portal{
width:35px;
height:35px;
border-radius:50%;
background:radial-gradient(circle,#fff,#ff6a00,#000);
box-shadow:0 0 20px orange;
animation:expand 3s forwards;
}

@keyframes expand{
0%{transform:scale(0)}
100%{transform:scale(50);opacity:0}
}

@keyframes fadeOut{
80%{opacity:1}
100%{opacity:0;pointer-events:none}
}

canvas{
position:fixed;
inset:0;
pointer-events:none;
z-index:0;
}

/* BUTTONS */
.theme-buttons{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
z-index:5;
}

.theme-btn{
padding:8px 14px;
border-radius:12px;
background:rgba(0,0,0,.6);
border:2px solid orange;
color:white;
}

/* SOCIAL */
.social-panel{
position:fixed;
left:10px;
top:20%;
z-index:5;
}

.social-btn img{
width:55px;
cursor:pointer;
filter:drop-shadow(0 0 12px orange);
}

.social-icons{
margin-top:10px;
display:flex;
flex-direction:column;
gap:10px;
opacity:0;
transform:translateX(-30px);
pointer-events:none;
transition:.4s;
}

.social-icons.show{
opacity:1;
transform:translateX(0);
pointer-events:auto;
}

.social-icons img{
width:44px;
border-radius:12px;
background:rgba(0,0,0,.7);
padding:6px;
}

/* LOGO */
section{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
z-index:2;
position:relative;
}

.glow-text{
font-size:3em;
font-weight:bold;
background:linear-gradient(90deg,var(--main),var(--glow),var(--soft));
-webkit-background-clip:text;
color:transparent;
animation:fire 1.5s infinite alternate,pulse 2s infinite;
}

@keyframes fire{
from{background-position:0%}
to{background-position:100%}
}

@keyframes pulse{
0%,100%{text-shadow:0 0 10px orange}
50%{text-shadow:0 0 40px orange}
}

@media(max-width:768px){
.glow-text{font-size:2.1em;}
}
</style>
</head>

<body>

<div id="intro"><div class="portal"></div></div>

<canvas id="embers"></canvas>

<div class="theme-buttons">
<button class="theme-btn" onclick="setTheme('inferno')">Inferno</button>
<button class="theme-btn" onclick="setTheme('echo')">Echo</button>
<button class="theme-btn" onclick="setTheme('dark')">Dark</button>
</div>

<!-- SOCIAL -->
<div class="social-panel" id="socialPanel">
<div class="social-btn">
<img src="SM.gif" alt="Menu">
</div>

<div class="social-icons" id="socialIcons">
<img src="youtube.png">
<img src="tiktok.png">
<img src="soundcloud.png">
<img src="facebook.png">
<img src="whatsapp.png">
</div>
</div>

<section>
<h1 class="glow-text">WanderAeon</h1>
</section>

<script>
const canvas=document.getElementById("embers");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
onresize=resize;

/* ⚡ LIGHT EMBERS (mobile optimized) */
let count = innerWidth<800 ? 50 : 120;
let embers=[];

for(let i=0;i<count;i++)
embers.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
s:Math.random()*2+1
});

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
embers.forEach(e=>{
e.y+=0.4;
if(e.y>canvas.height)e.y=0;
ctx.fillStyle="rgba(255,140,0,.7)";
ctx.beginPath();
ctx.arc(e.x,e.y,e.s,0,Math.PI*2);
ctx.fill();
});
requestAnimationFrame(animate);
}
animate();

/* THEMES */
function setTheme(t){
if(t=="inferno")document.body.style.backgroundImage="url('final.jpg')";
if(t=="echo")document.body.style.backgroundImage="url('echo.jpg')";
if(t=="dark")document.body.style.backgroundImage="url('dark.jpg')";
}

/* SOCIAL AUTO HIDE */
const panel=document.getElementById("socialPanel");
const icons=document.getElementById("socialIcons");
let timer;

function showSocial(){
icons.classList.add("show");
clearTimeout(timer);
timer=setTimeout(()=>icons.classList.remove("show"),3000);
}

panel.addEventListener("click",showSocial);
panel.addEventListener("touchstart",showSocial);
</script>

</body>
</html>
