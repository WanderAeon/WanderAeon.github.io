<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="referrer" content="no-referrer">
    <title>WanderAeon | Not just heard, experienced</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<style>
/* Reset dimensions precisely */
*, *::before, *::after { box-sizing: border-box; }
:root{ --main: #ff4500; --released: #00ff88; --teaser: #ff3333; --hit: #ffd700; --burn: #ffcc00; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505 url('final.jpg') center/cover no-repeat fixed; overflow: hidden; font-family: sans-serif; position: relative; user-select: none; }

/* NEON VISUALIZER BARS */
.visualizer-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 0 20px; z-index: 4; pointer-events: none; opacity: 0.6; }
.bar { width: 3px; height: 10px; background: var(--main); box-shadow: 0 0 10px var(--main); border-radius: 2px 2px 0 0; animation: bounce 1.5s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { height: 5px; opacity: 0.3; } 50% { height: 35px; opacity: 1; } }

/* ELASTIC CURSOR */
#cursor-container { position: fixed; pointer-events: none; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; display: none; }
#cursor-dot { position: absolute; width: 6px; height: 6px; background: var(--main); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--main), 0 0 30px var(--main); }
.orbit-letter { position: absolute; font-family: 'Orbitron'; font-size: 13px; color: white; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 10px var(--main); will-change: transform; }

@media (pointer: fine) { body { cursor: none; } a, .node, .social-btn, .social-icons a { cursor: none; } }

/* INTRO LAYER */
#intro { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; transition: opacity 1.5s ease-out 1s; pointer-events: auto; }
.intro-text { font-family: 'Orbitron'; font-size: 20px; color: white; letter-spacing: 12px; text-transform: uppercase; z-index: 1000; opacity: 0; animation: textFade 4s forwards 0.3s; }
@keyframes textFade { 0% { opacity: 0; filter: blur(10px); } 30%, 70% { opacity: 1; filter: blur(0px); text-shadow: 0 0 20px var(--main); } 100% { opacity: 0; filter: blur(10px); } }
.loaded #intro { opacity: 0; pointer-events: none; }

/* NODES (Fixed Positioning Logic) */
#universe { position: fixed; inset: 0; z-index: 5; pointer-events: auto; }
.node { 
    position: absolute; 
    font-family: 'Orbitron', sans-serif; 
    font-size: 10px; 
    color: rgba(255,255,255,0.7); 
    text-transform: uppercase; 
    letter-spacing: 1px; 
    cursor: pointer; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform: translate(-50%, -50%);
}
.node:hover { color: #white; transform: translate(-50%, -50%) scale(1.2); z-index: 10; opacity: 1 !important; }
.dot { width: 6px; height: 6px; border-radius: 50%; margin-bottom: 8px; transition: 0.3s; }
.red .dot { background: var(--teaser); box-shadow: 0 0 8px var(--teaser); }
.green .dot { background: var(--released); box-shadow: 0 0 8px var(--released); }
.gold .dot { background: var(--hit); box-shadow: 0 0 8px var(--hit); }
.node:hover .dot { transform: scale(1.5); box-shadow: 0 0 20px currentColor; }

/* SOCIAL PANEL */
.social-panel { position: fixed; left: 40px; top: 50%; transform: translateY(-50%); z-index: 100; pointer-events: auto; }
.social-btn { position: relative; width: 70px; height: 70px; cursor: pointer; border-radius: 50%; background: rgba(0,0,0,0.8); border: 2px solid var(--main); display: flex; justify-content: center; align-items: center; overflow: hidden; transition: 0.4s; }
.social-icons { position: absolute; top: 50%; left: 35px; width: 0; height: 350px; transform: translateY(-50%); display: flex; flex-direction: column; justify-content: center; gap: 15px; opacity: 0; visibility: hidden; transition: 0.5s; pointer-events: none; }
.social-icons.show { opacity: 1; visibility: visible; width: 100px; left: 90px; pointer-events: auto; }
.social-icons a { width: 50px; height: 50px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; display: flex; justify-content: center; align-items: center; transition: 0.3s; }

.glow-text { font-family: 'Orbitron'; font-size: 8vw; letter-spacing: 12px; background: linear-gradient(#fff, var(--main)); -webkit-background-clip: text; color: transparent; text-align: center; margin: 0; pointer-events: none; z-index: 2; position: relative; }

@media (max-width: 768px) {
    .social-panel { left: 10px; }
    .glow-text { font-size: 12vw; }
    #cursor-container, .visualizer-container { display: none !important; }
}
</style>
</head>
<body oncontextmenu="return false;">

<div class="visualizer-container" id="visualizer"></div>
<div id="cursor-container"><div id="cursor-dot"></div></div>

<div id="intro">
    <div class="intro-text">WanderAeon</div>
</div>

<canvas id="leaves-canvas"></canvas>
<canvas id="fire-canvas"></canvas>
<div id="universe"></div>

<div class="social-panel">
    <div class="social-btn" id="socialBtn"><img src="SM.gif" alt="Socials" style="width:100%"></div>
    <div class="social-icons" id="socialIcons">
        <a href="https://www.youtube.com/@WanderAeon" target="_blank"><img src="youtube.png" style="width:32px"></a>
        <a href="https://www.tiktok.com/@wanderaeon" target="_blank"><img src="tiktok.png" style="width:32px"></a>
        <a href="https://soundcloud.com/wanderaeon" target="_blank"><img src="soundcloud.png" style="width:32px"></a>
        <a href="https://www.facebook.com/profile.php?id=61584853409975" target="_blank"><img src="facebook.png" style="width:32px"></a>
        <a href="https://whatsapp.com/channel/0029VbBr6TtEVccDIQ0q6I2U" target="_blank"><img src="whatsapp.png" style="width:32px"></a>
    </div>
</div>

<section style="height:100vh; display:flex; justify-content:center; align-items:center;">
    <h1 class="glow-text">WanderAeon</h1>
</section>

<script>
// --- SECURITY ---
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) e.preventDefault();
});

setTimeout(() => { document.body.classList.add('loaded'); }, 4500);

// Visualizer
const viz = document.getElementById("visualizer");
for(let i=0; i<40; i++) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.animationDelay = `${Math.random() * 1.5}s`;
    viz.appendChild(bar);
}

// Cursor
const cursorContainer = document.getElementById("cursor-container");
const cursorDot = document.getElementById("cursor-dot");
const mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
const brandName = "WanderAeon";
const letters = [];

brandName.split("").forEach((char, index) => {
    const span = document.createElement("span");
    span.innerText = char;
    span.className = "orbit-letter";
    cursorContainer.appendChild(span);
    letters.push({ el: span, x: 0, y: 0, angle: (index / brandName.length) * Math.PI * 2 });
});

addEventListener("mousemove", e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    cursorDot.style.left = mouse.x + 'px';
    cursorDot.style.top = mouse.y + 'px';
    cursorContainer.style.display = 'block';
});

function animateCursor() {
    let t = Date.now() * 0.002;
    letters.forEach((letter, i) => {
        const orbitX = mouse.x + Math.cos(t + letter.angle) * 45;
        const orbitY = mouse.y + Math.sin(t + letter.angle) * 45;
        letter.x += (orbitX - letter.x) * 0.1;
        letter.y += (orbitY - letter.y) * 0.1;
        letter.el.style.transform = `translate(${letter.x}px, ${letter.y}px)`;
    });
    requestAnimationFrame(animateCursor);
}
animateCursor();

// Canvas (Leaves & Fire)
const lCanvas = document.getElementById("leaves-canvas"); const lCtx = lCanvas.getContext("2d");
const fCanvas = document.getElementById("fire-canvas"); const fCtx = fCanvas.getContext("2d");
let leaves = []; let flames = [];

function resize() { lCanvas.width = fCanvas.width = window.innerWidth; lCanvas.height = fCanvas.height = window.innerHeight; }
function spawnFire(x, y) { for(let i=0; i<2; i++) flames.push({ x, y, s: Math.random()*3+1, a:1, vx:(Math.random()-.5)*1, vy:-Math.random()*2 }); }

function draw() {
    lCtx.clearRect(0,0,lCanvas.width, lCanvas.height); fCtx.clearRect(0,0,fCanvas.width, fCanvas.height);
    flames.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.a -= 0.02;
        if(p.a <= 0) flames.splice(i, 1);
        else { fCtx.globalAlpha = p.a; fCtx.fillStyle = "orange"; fCtx.beginPath(); fCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); fCtx.fill(); }
    });
    requestAnimationFrame(draw);
}
resize(); draw(); window.onresize = resize;

// --- IMPROVED SONG NODES (Circular Orbit) ---
const songs = [
    { name: "Wanderer", type: "red", link: "https://youtu.be/oE4C19lM4fA" },
    { name: "Untamed Shadows", type: "green", link: "https://www.youtube.com/watch?v=VQXMUNpGjjQ" },
    { name: "Before the Return", type: "green", link: "https://www.youtube.com/watch?v=0wBXdnBznY0" },
    { name: "Sunno", type: "green", link: "https://www.youtube.com/watch?v=02uImf7-wfQ" },
    { name: "Sunna hay", type: "green", link: "https://www.youtube.com/watch?v=H9HPTlYHkjQ" },
    { name: "JanEJana", type: "gold", link: "https://www.youtube.com/watch?v=twd-aJLq30U" }
];

const univ = document.getElementById('universe');
const nodes = [];

songs.forEach((song, i) => {
    const el = document.createElement('div');
    el.className = `node ${song.type}`;
    el.innerHTML = `<div class="dot"></div><span>${song.name}</span>`;
    el.onclick = () => window.open(song.link, '_blank');
    univ.appendChild(el);

    // Calculate fixed circular positions around center
    const angle = (i / songs.length) * Math.PI * 2;
    const radiusX = window.innerWidth > 768 ? 30 : 35; // % of width
    const radiusY = window.innerWidth > 768 ? 35 : 30; // % of height
    
    const posX = 50 + Math.cos(angle) * radiusX;
    const posY = 50 + Math.sin(angle) * radiusY;

    el.style.left = posX + '%';
    el.style.top = posY + '%';
    
    // Add a gentle floating animation
    el.style.animation = `bounce ${3 + Math.random()*2}s infinite ease-in-out ${Math.random()*2}s`;
    
    nodes.push({ el, x: (posX/100)*window.innerWidth, y: (posY/100)*window.innerHeight });
});

// Proximity Fade Effect
addEventListener("mousemove", () => {
    nodes.forEach(n => {
        const dx = mouse.x - n.x; const dy = mouse.y - n.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        // Fade in when mouse is near, otherwise keep dim
        if(dist < 250) n.el.style.opacity = 1;
        else n.el.style.opacity = 0.3;
    });
    spawnFire(mouse.x, mouse.y);
});

const btn = document.getElementById("socialBtn");
const icons = document.getElementById("socialIcons");
btn.onclick = (e) => { e.stopPropagation(); icons.classList.toggle("show"); };
document.body.onclick = () => icons.classList.remove("show");
</script>
</body>
</html>
